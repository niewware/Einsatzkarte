  else if(m.carry==="own") R*=1.15;              // eigene Flagge: mehr Sicht
  return R;
}
/* Sichtpruefung mit Wald-Daempfung: Waldzellen kosten Sichtbudget –
   von aussen nach innen viel (5x), von innen nach aussen weniger (2,5x) */
function canSeeUnit(a,t){
  if(!grid) return true;
  const dist=Math.hypot(t.x-a.x,t.y-a.y);
  const h=headingOf(a);
  const ang=Math.atan2(t.y-a.y,t.x-a.x);
  const R=h===null?radiusFor(a,0):radiusFor(a,angDiff(ang,h));
  if(dist>R) return false;
  const {flags,GW,GH,cell}=grid;
  const inF=flagsAt(a.x,a.y)&16;
  const steps=Math.max(1,Math.ceil(dist/cell));
  let used=0;
  for(let s2=1;s2<steps;s2++){
    const tt=s2/steps;
    const cx=Math.floor((a.x+(t.x-a.x)*tt)/cell), cy=Math.floor((a.y+(t.y-a.y)*tt)/cell);
    if(cx<0||cy<0||cx>=GW||cy>=GH) return false;
    const f=flags[cy*GW+cx];
    if(f&4) return false;
    used+=cell*((f&16)?(inF?2.5:5):1);
    if(used>R) return false;
  }
  return true;
}
function canSee(m,active){
  for(const a of active) if(canSeeUnit(a,m)) return true;
  return false;
}
let visSig="", visLastT=0, foeLastT=0, visPending=false;
function unitSig(m){
  return ((m.x*4)|0)+","+((m.y*4)|0)+","
    +(m.focus?(m.focus.type+"~"+((((m.focus.ang||0))*64)|0)+"~"+((m.focus.x||0)|0)+"_"+((m.focus.y||0)|0)):"")
    +(m.walk&&m.walkDir!=null?("w"+((m.walkDir*64)|0)):"")
    +(m.carry||"")+(sel.has(m)?"S":"");
}
function updateVision(force){
  if(!grid||!area) return;
  const holes=document.getElementById("fogholes");
  const active=markers.filter(m=>m.color===placeColor);
  if(!active.length){
    if(fogRect) fogRect.style.display="none";
    for(const m of markers) if(m.g){ m.g.style.display=""; }
    L.focus.innerHTML="";
    visSig="";
    return;
  }
  if(fogRect) fogRect.style.display="";
  const now=performance.now();
  // Nur neu rendern, wenn sich am Zustand der eigenen Einheiten etwas geaendert hat
  // (Fog-Maske + Blur-Filter sind der teuerste Teil des Frames), max. ~22 Hz
  const sig=placeColor+"|"+active.map(unitSig).join(";");
  const sigChanged=sig!==visSig;
  if(sigChanged&&!force&&now-visLastT<45){
    if(!visPending){ visPending=true; requestAnimationFrame(()=>{ visPending=false; updateVision(); }); }
  } else if(sigChanged||force){
    visSig=sig; visLastT=now;
    const {flags,GW,GH,cell}=grid;
    const NRAYS=active.length<=4?RAYS:(active.length<=8?64:(active.length<=16?48:36));
    let d="";
    for(const m of active){
      const h=headingOf(m);
      const inF=flagsAt(m.x,m.y)&16;
      let poly="";
      for(let r=0;r<NRAYS;r++){
        const a=r/NRAYS*2*Math.PI;
        const R=h===null?radiusFor(m,0):radiusFor(m,angDiff(a,h));
        const dx=Math.cos(a), dy=Math.sin(a);
        let dist=R, used=0, t=0;
        for(;;){
          t+=cell;
          if(t>=R){ dist=R; break; }
          const cx=Math.floor((m.x+dx*t)/cell), cy=Math.floor((m.y+dy*t)/cell);
          if(cx<0||cy<0||cx>=GW||cy>=GH){ dist=t; break; }
          const f=flags[cy*GW+cx];
          if(f&4){ dist=t; break; }
          used+=cell*((f&16)?(inF?2.5:5):1);
          if(used>=R){ dist=t; break; }
        }
        poly+=(r?"L":"M")+(m.x+dx*dist).toFixed(1)+" "+(m.y+dy*dist).toFixed(1);
      }
      d+=poly+"Z";
    }
    holes.setAttribute("d",d);
    drawFocus(active);
  }
  updateKnowledge(false);
  // Fremde Einheiten nur zeigen, wenn eine aktive Einheit Sichtlinie hat (8 Hz reicht)
  if(force||now-foeLastT>=120){
    foeLastT=now;
    for(const m of markers){
      if(!m.g) continue;
      if(m.color===placeColor){ m.g.style.display=""; continue; }
      const visible=canSee(m,active);
      m.g.style.display=visible?"":"none";
      if(m.line) m.line.style.display=visible?"":"none";
    }
  }
}

/* Befehle */
function startWalk(m,res){
  const cum=[0];
  for(let i=1;i<res.pts.length;i++) cum.push(cum[i-1]+Math.hypot(res.pts[i][0]-res.pts[i-1][0],res.pts[i][1]-res.pts[i-1][1]));
  const total=cum[cum.length-1];
  m.walk={pts:res.pts,cum,total,dist:0,
    events:res.evFrac.map(e=>({at:e.f*total,d:BARRTYP[e.t][0],nr:BARRTYP[e.t][1]})),
    evI:0,pause:0};
  if(!m.dummy) drawRouteFor(m,res.pts);
}
async function routeAll(list,targets){
  setStatus("Berechne Wege …");
  await new Promise(r=>setTimeout(r,20));
  let ok=0;
  for(let i=0;i<list.length;i++){
    const m=list[i];
    if(m.walk){ m.walk=null; drawRouteFor(m,null); }
    const res=findPath(m.x,m.y,targets[i][0],targets[i][1]);
    if(!res) continue;
    startWalk(m,res); ok++;
    if(list.length>3&&i%2===1) await new Promise(r=>setTimeout(r,0));
  }
  if(!ok){ setStatus("Kein Weg gefunden."); return; }
  ensureAnim();
}
function spread(cx,cy,n){
  const s=3.5, cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols), pts=[];
  for(let i=0;i<n;i++){
    const r=Math.floor(i/cols), c=i%cols;
    pts.push([cx+(c-(cols-1)/2)*s, cy+(r-(rows-1)/2)*s]);
  }
  return pts;
}
function commandPoint(wx,wy){
  const list=[...sel];
  routeAll(list, spread(wx,wy,list.length));
}
function commandCurve(trail){
  const list=[...sel];
  const n=list.length;
  // Bogenlaenge der gezeichneten Linie
  const cum=[0];
  for(let i=1;i<trail.length;i++) cum.push(cum[i-1]+Math.hypot(trail[i][0]-trail[i-1][0],trail[i][1]-trail[i-1][1]));
  const total=cum[cum.length-1];
  const at=d=>{
    let i=1;
    while(i<cum.length&&cum[i]<d) i++;
    if(i>=cum.length) return trail[trail.length-1];
    const t=(d-cum[i-1])/Math.max(1e-9,cum[i]-cum[i-1]);
    return [trail[i-1][0]+(trail[i][0]-trail[i-1][0])*t, trail[i-1][1]+(trail[i][1]-trail[i-1][1])*t];
  };
  const targets=[];
  for(let i=0;i<n;i++) targets.push(at(n===1?total:total*i/(n-1)));
  // Zuordnung entlang der Sehne (Anfang->Ende), damit sich Wege wenig kreuzen
  const a=trail[0], b=trail[trail.length-1];
  const dx=b[0]-a[0], dy=b[1]-a[1];
  list.sort((m1,m2)=>((m1.x-a[0])*dx+(m1.y-a[1])*dy)-((m2.x-a[0])*dx+(m2.y-a[1])*dy));
  routeAll(list,targets);
}

/* Interaktion Detailkarte */
const selrectEl=document.getElementById("selrect");
const cmdlineEl=document.getElementById("cmdline");
let cmdTrail=[], trailActive=false;
dt.onClick=(sx,sy)=>{
  const [wx,wy]=toW(sx,sy);
  if(phase==="chooseFlag"&&flags&&flags.cand){
    const d0=Math.hypot(wx-flags.cand[0].x,wy-flags.cand[0].y), d1=Math.hypot(wx-flags.cand[1].x,wy-flags.cand[1].y);
    if(Math.min(d0,d1)<40) chooseFlagAt(d0<d1?0:1);
    else setStatus("Klicke auf eine der beiden markierten Flaggen-Positionen.");
    return;
  }
  if(phase==="chooseSet"&&defusal&&defusal.sets){
    const ds=defusal.sets.map(s=>Math.hypot(wx-s.spawn.x,wy-s.spawn.y));
    const i=ds[0]<=ds[1]?0:1;
    if(ds[i]<40) chooseSetAt(i);
    else setStatus("Klicke auf „Spawn 1“ oder „Spawn 2“, um die Konstellation zu wählen.");
    return;
  }
  if(placeMode){
    if(combatOn||phase!=="idle"){ setStatus("Spiel läuft – keine neuen Marker. Erst ⏹ Beenden."); return; }
    // auf naechste begehbare Stelle schnappen (nicht in Gebaeuden/Wasser stehen)
    let px=wx, py=wy;
    if(grid){
      const {flags,GW,GH,cell}=grid;
      let cx=Math.min(GW-1,Math.max(0,Math.floor(wx/cell))), cy=Math.min(GH-1,Math.max(0,Math.floor(wy/cell)));
      if(flags[cy*GW+cx]&1){
        outer: for(let r=1;r<120;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
          if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
          const nx=cx+dx, ny=cy+dy;
          if(nx<0||ny<0||nx>=GW||ny>=GH) continue;
          if(!(flags[ny*GW+nx]&1)){ cx=nx; cy=ny; break outer; }
        }
        px=(cx+0.5)*cell; py=(cy+0.5)*cell;
      }
    }
    const m={x:px,y:py,color:placeColor,walk:null};
    markers.push(m); drawMarkerEl(m); updateVision();
    setStatus("Marker gesetzt ("+markers.length+" gesamt).");
    return;
  }
  const hit=markerAt(sx,sy);
  if(hit){
    if(hit.color!==placeColor){ setStatus("Diese Einheit gehört einer anderen Farbe – Farbe oben wechseln."); return; }
    sel.clear(); sel.add(hit); redrawMarkers(); updateVision();
    setStatus("1 Einheit ausgewählt – Linie ziehen: bewegen (kurz = Punkt) · Rechtsklick: Fokus · Klick ins Leere: abwählen");
    return;
  }
  if(sel.size){ sel.clear(); redrawMarkers(); updateVision(); setStatus(null); }
};
dt.onLeftDragMove=(x0,y0,x,y)=>{
  if(placeMode) return;
  if(sel.size){
    if(!trailActive){ trailActive=true; cmdTrail=[[x0,y0]]; }
    const last=cmdTrail[cmdTrail.length-1];
    if(Math.hypot(x-last[0],y-last[1])>5) cmdTrail.push([x,y]);
    cmdlineEl.style.display="block";
    cmdlineEl.setAttribute("points",cmdTrail.map(p=>p[0]+","+p[1]).join(" ")+" "+x+","+y);
  } else {
    const rx=Math.min(x0,x), ry=Math.min(y0,y);
    selrectEl.style.display="block";
    selrectEl.style.left=rx+"px"; selrectEl.style.top=ry+"px";
    selrectEl.style.width=Math.abs(x-x0)+"px";
    selrectEl.style.height=Math.abs(y-y0)+"px";
  }
};
dt.onLeftDragEnd=(x0,y0,x1,y1)=>{
  cmdlineEl.style.display="none";
  selrectEl.style.display="none";
  if(placeMode) return;
  if(sel.size){
    if(!trailActive) cmdTrail=[[x0,y0]];
    trailActive=false;
    cmdTrail.push([x1,y1]);
    commandCurve(cmdTrail.map(p=>toW(p[0],p[1])));
    cmdTrail=[];
    return;
  }
  const [ax,ay]=toW(Math.min(x0,x1),Math.min(y0,y1));
  const [bx,by]=toW(Math.max(x0,x1),Math.max(y0,y1));
  sel.clear();
  for(const m of markers) if(m.color===placeColor&&m.x>=ax&&m.x<=bx&&m.y>=ay&&m.y<=by) sel.add(m);
  redrawMarkers(); updateVision();
  setStatus(sel.size?(sel.size+" Einheit(en) ausgewählt – Linie/Bogen ziehen: bewegen & verteilen · Rechtsklick: Fokus · Klick ins Leere: abwählen"):null);
};
dt.onDblClick=(sx,sy)=>{
  const hit=markerAt(sx,sy);
  if(hit&&hit.color===placeColor){
    if(hit.g) hit.g.remove();
    if(hit.line) hit.line.remove();
    markers.splice(markers.indexOf(hit),1);
    sel.delete(hit);
    updateVision();
    setStatus(null);
  }
};

/* Fokus-Gesten (rechte Maustaste) */
function addFocusLine(x1,y1,x2,y2,col,dash){
  const l=document.createElementNS(NS,"line");
  l.setAttribute("x1",x1); l.setAttribute("y1",y1);
  l.setAttribute("x2",x2); l.setAttribute("y2",y2);
  l.setAttribute("stroke",col); l.setAttribute("stroke-width",1.6);
  l.setAttribute("stroke-dasharray",dash||"5 4");
  l.setAttribute("vector-effect","non-scaling-stroke");
  L.focus.appendChild(l);
}
function drawFocus(active){
  L.focus.innerHTML="";
  const pts=new Map();
  for(const m of active){
    if(!m.focus) continue;
    const isSel=sel.has(m);
    const col=isSel?"#1c1c1a":"#8d8d86";
    const t=m.focus.type;
    const dash=(t==="point"||t==="dir")?"5 4":"1.5 5";   // Fokus gestrichelt, Blick gepunktet
    if(t==="point"||t==="facepoint"){
      addFocusLine(m.x,m.y,m.focus.x,m.focus.y,col,dash);
      const key=Math.round(m.focus.x)+","+Math.round(m.focus.y);
      const e=pts.get(key);
      if(!e) pts.set(key,{x:m.focus.x,y:m.focus.y,sel:isSel});
      else e.sel=e.sel||isSel;
    } else {
      const FL=55;
      addFocusLine(m.x,m.y,m.x+Math.cos(m.focus.ang)*FL,m.y+Math.sin(m.focus.ang)*FL,col,dash);
    }
  }
  for(const e of pts.values()){
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",e.x); c.setAttribute("cy",e.y); c.setAttribute("r",2.6);
    c.setAttribute("fill",e.sel?"#1c1c1a":"#8d8d86");
    c.setAttribute("stroke","#fff"); c.setAttribute("stroke-width",1);
    c.setAttribute("vector-effect","non-scaling-stroke");
    L.focus.appendChild(c);
  }
}
function centerAngTo(sx,sy){
  const [wx,wy]=toW(sx,sy);
  let cx=0,cy=0;
  for(const m of sel){cx+=m.x;cy+=m.y;}
  cx/=sel.size; cy/=sel.size;
  return Math.atan2(wy-cy,wx-cx);
}
function setFocusPoint(sx,sy){
  const [wx,wy]=toW(sx,sy);
  for(const m of sel) m.focus={type:"point",x:wx,y:wy};
  updateVision();
  setStatus("Fokus auf Punkt ("+sel.size+" Einheit(en)) – enge Sicht, beobachtet den Punkt auch beim Laufen.");
}
function setFocusDirParallel(sx,sy){
  const ang=centerAngTo(sx,sy);
  for(const m of sel) m.focus={type:"dir",ang};
  updateVision();
  setStatus("Fokus in Richtung (parallel) – enge Sicht, Richtung bleibt beim Laufen erhalten.");
}
function setFacePoint(sx,sy){
  const [wx,wy]=toW(sx,sy);
  for(const m of sel) m.focus={type:"facepoint",x:wx,y:wy};
  updateVision();
  setStatus("Blickrichtung auf Punkt – kein Fokus, 180° gute Sicht zum Punkt.");
}
function setFaceDirParallel(sx,sy){
  const ang=centerAngTo(sx,sy);
  for(const m of sel) m.focus={type:"facedir",ang};
  updateVision();
  setStatus("Blickrichtung parallel – kein Fokus, 180° gute Sicht in Klickrichtung.");
}
function clearFocus(){
  for(const m of sel) m.focus=null;
  updateVision();
  setStatus("Rundumsicht wiederhergestellt.");
}
/* Ziele entlang einer Linie auf die Auswahl verteilen (sortiert entlang der Sehne) */
function lineAssign(trail){
  const list=[...sel];
  const n=list.length;
  const cum=[0];
  for(let i=1;i<trail.length;i++) cum.push(cum[i-1]+Math.hypot(trail[i][0]-trail[i-1][0],trail[i][1]-trail[i-1][1]));
  const total=cum[cum.length-1];
  const at=d=>{
    let i=1;
    while(i<cum.length&&cum[i]<d) i++;
    if(i>=cum.length) return trail[trail.length-1];
    const t=(d-cum[i-1])/Math.max(1e-9,cum[i]-cum[i-1]);
    return [trail[i-1][0]+(trail[i][0]-trail[i-1][0])*t, trail[i-1][1]+(trail[i][1]-trail[i-1][1])*t];
  };
  const targets=[];
  for(let i=0;i<n;i++) targets.push(at(n===1?total:total*i/(n-1)));
  const a=trail[0], b=trail[trail.length-1];
  const dx=b[0]-a[0], dy=b[1]-a[1];
  list.sort((m1,m2)=>((m1.x-a[0])*dx+(m1.y-a[1])*dy)-((m2.x-a[0])*dx+(m2.y-a[1])*dy));
  return {list,targets};
}
function applyGazeLine(trail,withFocus){
  const {list,targets}=lineAssign(trail);
  for(let i=0;i<list.length;i++){
    list[i].focus={type:withFocus?"point":"facepoint", x:targets[i][0], y:targets[i][1]};
  }
  updateVision();
  setStatus((withFocus?"Fokus":"Blick")+"-Ziele entlang der Linie verteilt ("+list.length+" Einheit(en)).");
}

/* Rechte Maustaste: kurz = Blick, halten = Fokus (Cursor zeigt den Haltestatus) */
const HOLDMS=500;
const rcurEl=document.getElementById("rcur");
const rcurX=document.getElementById("rcurX"), rcurP=document.getElementById("rcurP");
let rGest=null, rHoldIv=0, rLastUp=0, rTimer=0, rIsSecond=false, rTrail=[];
function rcurUpdate(){
  if(!rGest) return;
  const ref=rGest.moved?rGest.lastMove:rGest.t0;
  const hold=(performance.now()-ref)>=HOLDMS;
  rcurX.style.display=hold?"none":"";
  rcurP.style.display=hold?"":"none";
}
dt.el.addEventListener("pointermove",e=>{
  if(!rGest) return;
  rcurEl.style.left=e.clientX+"px";
  rcurEl.style.top=e.clientY+"px";
});
dt.onRightDown=(sx,sy)=>{
  rIsSecond=(performance.now()-rLastUp)<350;    // Doppelklick am zweiten DRUECKEN erkennen
  if(rIsSecond) clearTimeout(rTimer);
  rGest={t0:performance.now(), lastMove:0, moved:false};
  rTrail=[[sx,sy]];
  if(area&&sel.size){
    rcurEl.style.left=sx+"px"; rcurEl.style.top=sy+"px";
    rcurEl.style.display="block";
    rcurUpdate();
    clearInterval(rHoldIv); rHoldIv=setInterval(rcurUpdate,80);
  }
};
dt.onRightDragMove=(x0,y0,x,y)=>{
  if(!rGest) return;
  rGest.moved=true; rGest.lastMove=performance.now();
  const last=rTrail[rTrail.length-1];
  if(Math.hypot(x-last[0],y-last[1])>5) rTrail.push([x,y]);
  if(area&&sel.size){
    cmdlineEl.style.display="block";
    cmdlineEl.style.stroke="#1c1c1a";
    cmdlineEl.setAttribute("points",rTrail.map(p=>p[0]+","+p[1]).join(" ")+" "+x+","+y);
  }
};
dt.onRightUp=(sx,sy,dur,moved)=>{
  clearInterval(rHoldIv);
  rcurEl.style.display="none";
  cmdlineEl.style.display="none"; cmdlineEl.style.stroke="";
  const g=rGest; rGest=null;
  // Wahlphase: Rechtsklick verschiebt den naechstgelegenen Vorschlags-Punkt
  if(area&&(phase==="chooseFlag"||phase==="chooseSet")){
    const [wx,wy]=toW(sx,sy);
    const pts=[];
    if(phase==="chooseFlag"&&flags&&flags.cand) for(const c of flags.cand) pts.push(c);
    if(phase==="chooseSet"&&defusal&&defusal.sets) for(const s of defusal.sets){ pts.push(s.a,s.b,s.spawn); }
    let best=null,bd=1e18;
    for(const p of pts){ const d=Math.hypot(p.x-wx,p.y-wy); if(d<bd){bd=d;best=p;} }
    if(best){
      const q=snapFreeXY(wx,wy,playerComp());
      best.x=q[0]; best.y=q[1];
      drawObjectives();
      setStatus("Punkt verschoben. Rechtsklick = nächstgelegenen Punkt hierher verschieben · Linksklick auf Punkt = bestätigen.");
    }
    rIsSecond=false;
    return;
  }
  if(!area||!sel.size){ rIsSecond=false; return; }
  if(moved&&g){                                            // Linie gezogen: Blick-/Fokus-Ziele verteilen
    rIsSecond=false; rLastUp=0;
    const still=performance.now()-g.lastMove;
    rTrail.push([sx,sy]);
    applyGazeLine(rTrail.map(p=>toW(p[0],p[1])), still>=HOLDMS);
    return;
  }
  if(rIsSecond){                                           // Doppelklick: parallel
    rIsSecond=false; rLastUp=0;
    if(dur>=HOLDMS) setFocusDirParallel(sx,sy);            // gehalten: FOKUS parallel
    else setFaceDirParallel(sx,sy);                        // kurz: Blick parallel
    return;
  }
  rLastUp=performance.now();
  if(dur>=HOLDMS){ rLastUp=0; setFocusPoint(sx,sy); return; }  // gehalten: FOKUS auf Punkt
  clearTimeout(rTimer);
  rTimer=setTimeout(()=>{ setFacePoint(sx,sy); },360);         // kurz: Blick auf Punkt
};

/* ===== Gefecht: Dummys, Patrouillen, Schiessen ===== */
const ENEMY_COLOR="#3a3a35";
let combatOn=false, lastCombat=0, enemyTotal=0, ownTotal=0;
function updateScore(){
  const el=document.getElementById("score");
  if(!combatOn){ el.style.display="none"; return; }
  const eAlive=markers.filter(m=>m.dummy&&!m.dead).length;
  const oAlive=markers.filter(m=>!m.dummy&&!m.dead).length;
  el.style.display="";
  el.textContent=`Eigene ${oAlive}/${ownTotal} · Gegner ${eAlive}/${enemyTotal}`;
  if(eAlive===0){
    if((gameMode==="ctf"||gameMode==="defusal")&&!gameOver) winGame("🎉 Alle Gegner ausgeschaltet – gewonnen!");
    else setStatus("🎉 Alle Gegner ausgeschaltet!");
  } else if(oAlive===0){
    if((gameMode==="ctf"||gameMode==="defusal")&&!gameOver) winGame("Alle eigenen Einheiten verloren – Niederlage.");
    else setStatus("Alle eigenen Einheiten verloren.");
  }
}
function killUnit(m){
  m.dead=true;
  if(m.dummy){
    // Gefahrenzone: hier ist ein Kamerad gefallen – 40 s meiden, Ueberlebende planen um
    dangerZones.push({x:m.x,y:m.y,until:performance.now()+40000});
    for(const u of markers){
      if(!u.dummy||u.dead||u.role!=="atk") continue;
      if(Math.hypot(u.x-m.x,u.y-m.y)<80){ u.walk=null; u.atkPhase=0; u.nextAi=performance.now()+1000+Math.random()*2000; }
    }
  }
  if(m.g){ m.g.remove(); m.g=null; }
  if(m.line){ m.line.remove(); m.line=null; }
  const g=document.createElementNS(NS,"g");
  const px=document.createElementNS(NS,"path");
  px.setAttribute("d","M-4 -4 L4 4 M-4 4 L4 -4");
  px.setAttribute("stroke","#6d6d68"); px.setAttribute("stroke-width",2);
  px.setAttribute("fill","none"); px.setAttribute("vector-effect","non-scaling-stroke");
  g.appendChild(px);
  g.setAttribute("transform",`translate(${m.x} ${m.y})`);
  L.walk.insertBefore(g,L.walk.firstChild);
  markers.splice(markers.indexOf(m),1);
  sel.delete(m);
  updateVision(true);
  updateScore();
}
function tracer(s,pt,hit){
  const l=document.createElementNS(NS,"line");
  l.setAttribute("x1",s.x); l.setAttribute("y1",s.y);
  l.setAttribute("x2",pt[0]); l.setAttribute("y2",pt[1]);
  l.setAttribute("stroke",s.dummy?ENEMY_COLOR:s.color);
  l.setAttribute("stroke-width",hit?1.8:1);
  l.setAttribute("vector-effect","non-scaling-stroke");
  l.setAttribute("opacity",".85");
  L.walk.appendChild(l);
  setTimeout(()=>l.remove(),130);
}
function spawnDummies(n){
  const {flags,GW,GH,cell,comp}=grid;
  const players=markers.filter(m=>!m.dummy);
  const pComps=new Set(players.map(p=>compAt(p.x,p.y)));   // nur Bereiche mit eigenen Einheiten
  const minDists=[150,60,0];
  let cands=[];
  for(const minD of minDists){
    cands=[];
    for(let i=0;i<2500&&cands.length<400;i++){
      const cx=(Math.random()*GW)|0, cy=(Math.random()*GH)|0;
      const f=flags[cy*GW+cx];
      if(f&1||f&8) continue;
      if(!pComps.has(comp[cy*GW+cx])) continue;
      const x=(cx+0.5)*cell, y=(cy+0.5)*cell;
      let dn=1e9;
      for(const p of players) dn=Math.min(dn,Math.hypot(p.x-x,p.y-y));
      if(dn<minD) continue;
      addCand(cands,cx,cy,x,y,dn,flags,GW,GH);
    }
    if(cands.length>=n) break;
  }
  return finishSpawn(cands,n,players);
}
function addCand(cands,cx,cy,x,y,dn,flags,GW,GH){
    let cover=0;
    for(const [ox,oy] of [[3,0],[-3,0],[0,3],[0,-3]]){
      const nx=cx+ox, ny=cy+oy;
      if(nx>=0&&ny>=0&&nx<GW&&ny<GH&&(flags[ny*GW+nx]&1)) cover=1;
    }
  cands.push({x,y,score:-Math.abs(dn-280)+cover*70+Math.random()*40});
}
function finishSpawn(cands,n,players){
  cands.sort((a,b)=>b.score-a.score);
  const placed=[];
  for(const c of cands){
    if(placed.length>=n) break;
    if(placed.some(p=>Math.hypot(p.x-c.x,p.y-c.y)<45)) continue;
    placed.push(c);
  }
  for(const c of placed){
    const m={x:c.x,y:c.y,color:ENEMY_COLOR,dummy:true,hp:3,walk:null};
    let np=null,nd=1e9;
    for(const p of players){ const d=Math.hypot(p.x-c.x,p.y-c.y); if(d<nd){nd=d;np=p;} }
    const ang=np?Math.atan2(np.y-c.y,np.x-c.x):Math.random()*6.283;
    const roll=Math.random();
    if(roll<0.35) m.focus={type:"dir",ang};           // mit Fokus
    else if(roll<0.85) m.focus={type:"facedir",ang};  // nur Blickrichtung
    if(Math.random()<0.5){
      for(let tr=0;tr<8;tr++){
        const pa=Math.random()*6.283, pd=40+Math.random()*55;
        const res=findPath(c.x,c.y,c.x+Math.cos(pa)*pd,c.y+Math.sin(pa)*pd);
        if(res&&res.pts.length>1){
          m.patrol={ptsA:res.pts,ptsB:[...res.pts].reverse(),dirA:true,nextAt:performance.now()+1000+Math.random()*4000};
          break;
        }
      }
    }
    markers.push(m); drawMarkerEl(m);
  }
  updateVision(true);
  return placed.length;
}
function patrolStep(now){
  for(const m of markers){
    if(!m.dummy||m.dead||!m.patrol||m.walk) continue;
    if(m.patrol.nextAt==null){ m.patrol.nextAt=now+1500+Math.random()*3000; continue; }
    if(now>=m.patrol.nextAt){
      m.patrol.nextAt=null;
      const pts=(m.patrol.dirA?m.patrol.ptsA:m.patrol.ptsB).map(p=>[p[0],p[1]]);
      m.patrol.dirA=!m.patrol.dirA;
      pts[0]=[m.x,m.y];
      startWalk(m,{pts,evFrac:[]});
      ensureAnim();
    }
  }
}
function combatStep(now){
  if(gameOver) return;
  if(now-lastCombat<150) return;
  lastCombat=now;
  const dummiesL=[], ownsL=[];
  for(const m of markers) if(!m.dead) (m.dummy?dummiesL:ownsL).push(m);
  for(const s of [...markers]){
    if(s.dead) continue;
    const foes=s.dummy?ownsL:dummiesL;
    if(!foes.length) continue;
    const hasFocus=s.focus&&(s.focus.type==="point"||s.focus.type==="dir");
    const underFire=s.underFire&&(now-s.underFire<6000);
    if(!s.dummy&&!hasFocus&&!underFire) continue;   // eigene nur mit Fokus oder unter Beschuss
    if(s.nextShot&&now<s.nextShot) continue;
    // Kandidaten nach Distanz sortieren, erster sichtbarer gewinnt (spart Sicht-Raycasts)
    const cand=[];
    for(const t of foes){
      const d=Math.hypot(t.x-s.x,t.y-s.y);
      if(d<200) cand.push([d,t]);
    }
    cand.sort((a,b)=>a[0]-b[0]);
    let best=null,bd=1e9;
    for(const [d,t] of cand){ if(canSeeUnit(s,t)){ bd=d; best=t; break; } }
    if(!best) continue;
    if(s.dummy){
      enemyContact(s,best,now);             // Alarm/Spaeher-Rueckzug/Nachschub
      lastContacts.push({x:best.x,y:best.y,t:now});   // Spieler gesichtet
      if(lastContacts.length>25) lastContacts.shift();
    }
    const ang=Math.atan2(best.y-s.y,best.x-s.x);
    const h=headingOf(s);
    const inCone=hasFocus&&h!==null&&Math.abs(angDiff(ang,h))<0.6;
    s.nextShot=now+(inCone?800:2000)+Math.random()*300;
    s.lastShotT=now; s.lastShotDir=ang;
    best.underFire=now;
    best.threat={x:s.x,y:s.y};
    if(best.dummy&&!s.dummy){ lastContacts.push({x:s.x,y:s.y,t:now}); if(lastContacts.length>25) lastContacts.shift(); }
    const p=Math.min(0.9,(inCone?0.45:0.12)*Math.max(0.35,1-bd/170));
    if(Math.random()<p){
      tracer(s,[best.x,best.y],true);
      best.hp=(best.hp==null?3:best.hp)-1;
      if(best.hp<=0){ killUnit(best); setStatus((best.dummy?"Gegner":"Eigene Einheit")+" ausgeschaltet!"); }
      else drawMarkerEl(best);
    } else {
      const off=(6+Math.random()*8), oa=ang+(Math.random()<0.5?1:-1)*Math.PI/2;
      tracer(s,[best.x+Math.cos(oa)*off,best.y+Math.sin(oa)*off],false);
    }
    // Kameraden, die den Schuetzen sehen und keinen Befehl haben, blicken in Schussrichtung
    for(const u of markers){
      if(u.dead||u===s||u.dummy!==s.dummy||u.focus) continue;
      if(canSeeUnit(u,s)) u.focus={type:"facedir",ang};
    }
  }
}
/* ===== Spielmodi ===== */
let gameMode="skirmish", phase="idle", gameOver=false, gameMsg="";
let flags=null, defusal=null;
function snapFreeXY(x,y,cid){
  // Optional cid: nur Zellen dieser Zusammenhangskomponente akzeptieren –
  // sonst landet ein Snap gern im abgeschlossenen Innenhof nebenan (Einheiten stecken fest)
  if(!grid) return [x,y];
  const {flags:F,GW,GH,cell,comp}=grid;
  let cx=Math.min(GW-1,Math.max(0,Math.floor(x/cell))), cy=Math.min(GH-1,Math.max(0,Math.floor(y/cell)));
  const bad=i=>(F[i]&1)||(cid!=null&&comp[i]!==cid);
  if(bad(cy*GW+cx)){
    let hit=false;
    outer: for(let r=1;r<300;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=GW||ny>=GH) continue;
      if(!bad(ny*GW+nx)){ cx=nx; cy=ny; hit=true; break outer; }
    }
    if(!hit&&cid!=null) return snapFreeXY(x,y);   // Notnagel ohne Komponenten-Filter
  }
  return [(cx+0.5)*cell,(cy+0.5)*cell];
}
function teleportUnits(cx,cy){
  const own=markers.filter(m=>!m.dummy&&m.color===placeColor);
  const pts=spread(cx,cy,own.length);
  const cid=compAt(cx,cy);
  own.forEach((m,i)=>{
    const q=snapFreeXY(pts[i][0],pts[i][1],cid);
    m.x=q[0]; m.y=q[1]; m.walk=null; m.walkDir=null; m.focus=null; m.carry=null;
    drawRouteFor(m,null); drawMarkerEl(m);
  });
  sel.clear(); redrawMarkers();
}
function goodCands(compId,n){
  const {flags:F,GW,GH,cell,comp}=grid;
  const M=Math.ceil(35/cell);   // Randabstand: Ziele nie an der Kartenkante (Einheiten klemmen dort)
  const out=[];
  for(let i=0;i<6000&&out.length<n;i++){
    const cx=M+((Math.random()*(GW-2*M))|0), cy=M+((Math.random()*(GH-2*M))|0);
    const f=F[cy*GW+cx];
    if(f&1||f&8) continue;
    if(comp[cy*GW+cx]!==compId) continue;
    // Deckungs-Scoring aus dem Taktik-Training: Wand/Ecke in 1-5 von 8 Richtungen
    // = gut verteidigbare Stellung; 0 = freies Feld, >5 = Loch
    let walls=0;
    for(let a2=0;a2<8;a2++){
      const nx=cx+Math.round(Math.cos(a2/8*2*Math.PI)*3), ny=cy+Math.round(Math.sin(a2/8*2*Math.PI)*3);
      if(nx<0||ny<0||nx>=GW||ny>=GH) continue;
      if(F[ny*GW+nx]&1) walls++;
    }
    const cover=(walls>=1&&walls<=5)?walls:0;
    out.push({x:(cx+0.5)*cell,y:(cy+0.5)*cell,cover});
  }
  return out;
}
function playerComp(){
  const p=markers.find(m=>!m.dummy&&m.color===placeColor);
  return p?compAt(p.x,p.y):(grid.playable[0]??0);
}
function makeDummy(x,y,ang,role,anchor){
  const m={x,y,color:ENEMY_COLOR,dummy:true,hp:3,walk:null,role:role||null,anchor:anchor||null,nextAi:0};
  if(Math.random()<0.6) m.focus={type:"facedir",ang};
  markers.push(m); drawMarkerEl(m);
  return m;
}
function spawnEnemiesAt(cx,cy,count,role,faceTo){
  const cid=compAt(cx,cy);
  for(const p of spread(cx,cy,count)){
    const q=snapFreeXY(p[0],p[1],cid);
    const ang=faceTo?Math.atan2(faceTo.y-q[1],faceTo.x-q[0]):Math.random()*6.283;
    makeDummy(q[0],q[1],ang,role,{x:cx,y:cy});
  }
}
/* ===== Verteidigungs-Planer =====
   Analysiert die Umgebung eines Spots: Anmarsch-Korridore (BFS), Engstellen
   (minimale Gangbreite je Korridor), Wachposten mit Deckung + Sichtlinie auf
   die Engstelle, Spaeher an den Korridormuendungen. */
let planDist=null, planPrev=null, planQ=null;
function canSeePoint(x0,y0,x1,y1){
  const {flags,GW,GH,cell}=grid;
  const d=Math.hypot(x1-x0,y1-y0), steps=Math.max(1,Math.ceil(d/cell));
  for(let s=1;s<steps;s++){
    const t=s/steps;
    const cx=Math.floor((x0+(x1-x0)*t)/cell), cy=Math.floor((y0+(y1-y0)*t)/cell);
    if(cx<0||cy<0||cx>=GW||cy>=GH) return false;
    if(flags[cy*GW+cx]&4) return false;
  }
  return true;
}
function clearanceOf(i,maxR){
  const {flags,GW,GH}=grid;
  const cx=i%GW, cy=(i/GW)|0;
  for(let r=1;r<=maxR;r++){
    for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=GW||ny>=GH) return r;
      if(flags[ny*GW+nx]&1) return r;
    }
  }
  return maxR+1;
}
function planDefense(sx,sy,nGuards,nScouts){
  const {flags,GW,GH,cell}=grid;
  const N=GW*GH;
  if(!planDist||planDist.length!==N){ planDist=new Int32Array(N); planPrev=new Int32Array(N); planQ=new Int32Array(N); }
  planDist.fill(-1);
  const [qx,qy]=snapFreeXY(sx,sy);
  const cid=compAt(qx,qy);
  const scx=(qx/cell)|0, scy=(qy/cell)|0;
  const si=scy*GW+scx;
  const RMAX=Math.ceil(120/cell);
  let qh=0,qt=0;
  planDist[si]=0; planPrev[si]=-1; planQ[qt++]=si;
  while(qh<qt){
    const i=planQ[qh++];
    const d=planDist[i];
    if(d>=RMAX) continue;
    const cx=i%GW, cy=(i/GW)|0;
    if(cx>0){ const nn=i-1; if(!(flags[nn]&1)&&planDist[nn]<0){ planDist[nn]=d+1; planPrev[nn]=i; planQ[qt++]=nn; } }
    if(cx<GW-1){ const nn=i+1; if(!(flags[nn]&1)&&planDist[nn]<0){ planDist[nn]=d+1; planPrev[nn]=i; planQ[qt++]=nn; } }
    if(cy>0){ const nn=i-GW; if(!(flags[nn]&1)&&planDist[nn]<0){ planDist[nn]=d+1; planPrev[nn]=i; planQ[qt++]=nn; } }
    if(cy<GH-1){ const nn=i+GW; if(!(flags[nn]&1)&&planDist[nn]<0){ planDist[nn]=d+1; planPrev[nn]=i; planQ[qt++]=nn; } }
  }
  // Anmarsch-Korridore: erreichbare Zellen im Ring 65–120 m, nach Richtung gebuendelt
  const NB=16;
  const bins=Array.from({length:NB},()=>({cnt:0,deep:-1,deepD:0}));
  const dLo=Math.ceil(65/cell);
  for(let k=0;k<qt;k++){
    const i=planQ[k], d=planDist[i];
    if(d<dLo) continue;
    const cx=i%GW, cy=(i/GW)|0;
    const b=(Math.floor((Math.atan2(cy-scy,cx-scx)+Math.PI)/(2*Math.PI)*NB)+NB)%NB;
    bins[b].cnt++;
    if(d>bins[b].deepD){ bins[b].deepD=d; bins[b].deep=i; }
  }
  const corridors=bins.filter(b=>b.cnt>=15&&b.deep>=0).sort((a,b)=>b.cnt-a.cnt);
  const ctr=i=>[((i%GW)+0.5)*cell,(((i/GW)|0)+0.5)*cell];
  const wallNear=i=>clearanceOf(i,4)<=3;
  const guards=[], scouts=[];
  // Je Korridor: Engstelle finden, Wachposten dahinter (spotseitig) mit Deckung + Sicht auf die Engstelle
  for(let g=0;g<nGuards&&corridors.length;g++){
    const cor=corridors[g%corridors.length];
    let i=cor.deep, choke=-1, chokeW=1e9;
    while(i>=0&&planDist[i]>Math.ceil(AIP.chokeNear/cell)){
      const dM=planDist[i]*cell;
      if(dM<=AIP.chokeFar){ const w=clearanceOf(i,8); if(w<chokeW){ chokeW=w; choke=i; } }
      i=planPrev[i];
    }
    if(choke<0) choke=cor.deep;
    const [chx,chy]=ctr(choke);
    // Kandidaten auf der Kette Richtung Spot, 12–38 m hinter der Engstelle, plus seitliche Ausweicher
    let best=null, bestS=-1e9, j=planPrev[choke];
    while(j>=0&&planDist[j]>1){
      const gap=(planDist[choke]-planDist[j])*cell;
      if(gap>AIP.guardMax) break;
      if(gap>=AIP.guardMin){
        const cands=[j, j-2, j+2, j-2*GW, j+2*GW];
        for(const c of cands){
          if(c<0||c>=N||(flags[c]&1)) continue;
          const [px,py]=ctr(c);
          if(!canSeePoint(px,py,chx,chy)) continue;
          const s=(wallNear(c)?3:0)+(1-Math.abs(gap-AIP.guardIdeal)/28)+Math.random()*0.7;
          if(s>bestS){ bestS=s; best=c; }
        }
      }
      j=planPrev[j];
    }
    if(best==null) best=choke;
    const [px,py]=ctr(best);
    guards.push({x:px,y:py,fx:chx,fy:chy,withFocus:Math.random()<AIP.focusShare});
  }
  // Rest ohne Korridor: Ring um den Spot, Blick nach aussen, Deckung bevorzugt
  while(guards.length<nGuards){
    const k=guards.length, ang=k*2.399963;   // goldener Winkel: gleichmaessig, nicht gitterig
    const [px,py]=snapFreeXY(qx+Math.cos(ang)*AIP.ringR,qy+Math.sin(ang)*AIP.ringR,cid);
    guards.push({x:px,y:py,fx:qx+Math.cos(ang)*70,fy:qy+Math.sin(ang)*70,withFocus:false});
  }
  // Spaeher: an die Muendung der groessten Korridore (~100 m), Blick weiter nach draussen
  for(let s=0;s<nScouts;s++){
    const cor=corridors[s%Math.max(1,corridors.length)];
    if(!cor||cor.deep<0){ break; }
    const [px,py]=ctr(cor.deep);
    const ang=Math.atan2(py-qy,px-qx);
    scouts.push({x:px,y:py,fx:px+Math.cos(ang)*50,fy:py+Math.sin(ang)*50,withFocus:false});
  }
  return {guards,scouts,spot:{x:qx,y:qy}};
}
function assignDefense(units,spot){
  if(!units.length) return;
  const nScout=units.length>=3?1:0;
  const plan=planDefense(spot.x,spot.y,units.length-nScout,nScout);
  const orders=[...plan.guards,...plan.scouts.map(o=>({...o,scout:true}))];
  units.forEach((m,i)=>{
    const o=orders[i%orders.length];
    m.homeSpot={x:plan.spot.x,y:plan.spot.y};
    m.anchor={x:plan.spot.x,y:plan.spot.y};
    m.order={x:o.x,y:o.y,fx:o.fx,fy:o.fy,withFocus:!!o.withFocus};
    m.role=o.scout?"scout":"def";
    m.focus=null; m.nextAi=0;
  });
}
/* Posten halten: hinlaufen, dort Fokus/Blick auf den zugewiesenen Punkt */
function aiHoldOrder(m,now){
  let o=m.order;
  if(m.tempOrder){
    if(now<m.tempOrder.until) o=m.tempOrder;
    else { m.tempOrder=null; m.focus=null; m.nextAi=0; }
  }
  if(!o){ if(m.anchor) wanderNear(m,now,m.anchor.x,m.anchor.y,45); return; }
  const d=Math.hypot(m.x-o.x,m.y-o.y);
  if(d>4){
    if(!m.walk&&now>(m.nextAi||0)){
      const r=findPath(m.x,m.y,o.x,o.y);
      if(r&&r.pts.length>1) startWalk(m,r);
      m.nextAi=now+2500+Math.random()*2000;
    }
  } else if(!m.walk&&!(m.focus&&m.focus.__noise)&&(!m.focus||m.focus.__o!==o)){
    m.focus={type:o.withFocus?"point":"facepoint",x:o.fx,y:o.fy,__o:o};
  }
}
/* ===== Taktik-KI: Trupps, Stellungsanalyse, Bounding-Advance =====
   Gefallene hinterlassen 40 s Gefahrenzonen; Trupps zu 3-4 Soldaten, jeder in
   seinem lateralen Band; Karte wird auf leicht verteidigbare Stellungen (Ecken/
   Kanten mit Deckung) analysiert; Vorrücken im Überschlag: eine Hälfte läuft,
   die andere sichert mit Fokus auf die wahrscheinlichste Spielerposition. */
/* Taktik-Parameter zentral & von aussen setzbar (Evolutions-Training):
   atk* = Angreifer-Trupps, def* = Stellungsverteidigung */
const AIP=window.AIP={
  // Werte aus Selbstspiel-Evolution 2026-08-25, Lauf 2 (26 Generationen):
  // Angreifer: schneller denken, kuerzer decken, breiter flanken; Verteidiger: naeher an die Engstelle, mehr Fokus
  advMin:38, advMax:143, band:141, squadSize:3.75, thinkMs:558, planPause:1500, planPauseRnd:2880,
  coverMin:3100, coverRnd:2780,
  guardMin:10.6, guardMax:37.6, chokeNear:16.6, chokeFar:54.6, guardIdeal:17, focusShare:0.69, ringR:19
};
let dangerZones=[], strongpoints=null, squads=[], lastContacts=[];
function seekCover(m,now){
  if(!(m.underFire&&now-m.underFire<3000)||m.covering) return false;
  m.covering=now+AIP.coverMin+Math.random()*AIP.coverRnd;
  m.walk=null;
  const th=m.threat;
  let best=null,bs=-1e9;
  for(let a2=0;a2<8;a2++){
    const ang=a2/8*2*Math.PI;
    const q=snapFreeXY(m.x+Math.cos(ang)*12,m.y+Math.sin(ang)*12,compAt(m.x,m.y));
    let s2=Math.random();
    if(th){
      s2+=(Math.hypot(q[0]-th.x,q[1]-th.y)-Math.hypot(m.x-th.x,m.y-th.y))*0.05;
      if(!canSeePoint(q[0],q[1],th.x,th.y)) s2+=3;   // hinter Sichtdeckung
    }
    if(s2>bs){ bs=s2; best=q; }
  }
  if(best){ const r=findPath(m.x,m.y,best[0],best[1]); if(r) startWalk(m,r); }
  return true;
}
function computeStrongpoints(){
  // leicht zu verteidigen: freie Zelle mit Wand/Ecke in 1-5 von 8 Richtungen
  const {flags,GW,GH,cell}=grid;
  const pts=[];
  for(let i=0;i<12000&&pts.length<400;i++){
    const cx=(Math.random()*GW)|0, cy=(Math.random()*GH)|0;
    const f=flags[cy*GW+cx];
    if(f&(1|8|32)) continue;               // nicht auf Strassen: zu exponiert
    let walls=0;
    for(let a=0;a<8;a++){
      const nx=cx+Math.round(Math.cos(a/8*2*Math.PI)*3), ny=cy+Math.round(Math.sin(a/8*2*Math.PI)*3);
      if(nx<0||ny<0||nx>=GW||ny>=GH) continue;
      if(flags[ny*GW+nx]&1) walls++;
    }
    if(walls<1||walls>5) continue;
    const x=(cx+0.5)*cell, y=(cy+0.5)*cell;
    pts.push({x,y,walls,comp:compAt(x,y)});
  }
  return pts;
}
function playerCentroid(){
  const ps=markers.filter(m=>!m.dummy&&!m.dead);
  if(!ps.length) return {x:area.Wm/2,y:area.Hm/2};
  let x=0,y=0; for(const p of ps){x+=p.x;y+=p.y;}
  return {x:x/ps.length,y:y/ps.length};
}
function makeSquads(units,objective){
  if(!units.length) return;
  let bx=0,by=0; for(const u of units){bx+=u.x;by+=u.y;}
  const base={x:bx/units.length,y:by/units.length};
  const o=objective();
  const ax=o.x-base.x, ay=o.y-base.y, L=Math.hypot(ax,ay)||1;
  const ux=ax/L, uy=ay/L, nx=-uy, ny=ux;
  const ns=Math.max(1,Math.round(units.length/AIP.squadSize));
  units.sort((a,b)=>((a.x-base.x)*nx+(a.y-base.y)*ny)-((b.x-base.x)*nx+(b.y-base.y)*ny));
  for(let s=0;s<ns;s++){
    const members=units.filter((u,i)=>Math.floor(i*ns/units.length)===s);
    if(!members.length) continue;
    const sq={members,band:(s-(ns-1)/2)*AIP.band,ux,uy,nx,ny,base,objective,
      pos:{x:base.x,y:base.y},state:"plan",next:null,movingSet:null,
      waveA:members.filter((u,i)=>i%2===0),waveB:members.filter((u,i)=>i%2===1),
      nextAt:performance.now()+s*4000+Math.random()*3000};   // Trupps starten versetzt
    for(const u of members){ u.squad=sq; u.role="sq"; }
    squads.push(sq);
  }
}
function predictSpot(sq,now){
  // wo steckt der Spieler vermutlich? Frische Kontakte > Strongpoint vor uns > Ziel
  const fresh=lastContacts.filter(c=>now-c.t<20000);
  if(fresh.length){
    let best=null,bd=1e18;
    for(const c of fresh){ const d=Math.hypot(c.x-sq.pos.x,c.y-sq.pos.y); if(d<bd){bd=d;best=c;} }
    if(bd<220) return best;
  }
  const obj=sq.objective();
  let best=null,bd=1e18;
  for(const sp of (strongpoints||[])){
    const d1=Math.hypot(sp.x-sq.pos.x,sp.y-sq.pos.y);
    if(d1<30||d1>200) continue;
    if((sp.x-sq.pos.x)*sq.ux+(sp.y-sq.pos.y)*sq.uy<10) continue;   // nur vor uns
    const s2=d1+Math.hypot(sp.x-obj.x,sp.y-obj.y)*0.3;
    if(s2<bd){ bd=s2; best=sp; }
  }
  return best||obj;
}
function squadThink(sq,now){
  if(now<sq.nextAt) return;
  sq.nextAt=now+AIP.thinkMs;
  const alive=sq.members.filter(u=>!u.dead&&!u.carry);
  if(!alive.length) return;
  let px=0,py=0; for(const u of alive){px+=u.x;py+=u.y;}
  sq.pos={x:px/alive.length,y:py/alive.length};
  const obj=sq.objective();
  if(sq.state==="plan"){
    // naechste Stellung: Strongpoint 35-140 m naeher am Ziel, im eigenen Band.
    // WICHTIG: Kandidaten per echter Wegsuche pruefen - Luftlinien-Naehe hinter
    // einer Haeuserzeile bedeutet sonst einen Riesenumweg zu Fuss (Quatsch-Etappen)
    const prog=p=>(obj.x-p.x)*sq.ux+(obj.y-p.y)*sq.uy;
    const myProg=prog(sq.pos);
    const pathLen=(x,y)=>{
      const air=Math.hypot(x-sq.pos.x,y-sq.pos.y);
      const r=findPath(sq.pos.x,sq.pos.y,x,y);
      if(!r) return null;
      let L=0;
      for(let k=1;k<r.pts.length;k++) L+=Math.hypot(r.pts[k][0]-r.pts[k-1][0],r.pts[k][1]-r.pts[k-1][1]);
      return {L,air};
    };
    const okPath=(x,y)=>{
      const p=pathLen(x,y);
      return p&&p.L<=p.air*2.2+30;
    };
    const cands=[];
    for(const sp of (strongpoints||[])){
      if(sp.comp!==compAt(sq.pos.x,sq.pos.y)) continue;
      const adv=myProg-prog(sp);
      if(adv<AIP.advMin||adv>AIP.advMax) continue;
      const lat=(sp.x-sq.base.x)*sq.nx+(sp.y-sq.base.y)*sq.ny;
      let s2=-Math.abs(lat-sq.band)*0.02+sp.walls*0.5+Math.random();
      if(dangerZones.some(z=>now<z.until&&Math.hypot(sp.x-z.x,sp.y-z.y)<45)) s2-=9;
      cands.push({sp,s2});
    }
    cands.sort((a,b)=>b.s2-a.s2);
    let best=null;
    for(const c of cands.slice(0,5)){
      if(okPath(c.sp.x,c.sp.y)){ best=c.sp; break; }
    }
    if(Math.hypot(obj.x-sq.pos.x,obj.y-sq.pos.y)<70) best={x:obj.x,y:obj.y};
    else if(!best){
      // kein brauchbarer Strongpoint: Etappe ~110 m Richtung Ziel, notfalls seitlich versetzt
      for(const off of [0,70,-70]){
        const q=snapFreeXY(sq.pos.x+sq.ux*110+sq.nx*off,sq.pos.y+sq.uy*110+sq.ny*off,compAt(sq.pos.x,sq.pos.y));
        if(okPath(q[0],q[1])){ best={x:q[0],y:q[1]}; break; }
      }
      if(!best){
        const q=snapFreeXY(sq.pos.x+sq.ux*110,sq.pos.y+sq.uy*110,compAt(sq.pos.x,sq.pos.y));
        best={x:q[0],y:q[1]};
      }
    }
    sq.next=best; sq.state="moveA"; sq.movingSet=null;
  }
  if(sq.state==="moveA"||sq.state==="moveB"){
    const movers=(sq.state==="moveA"?sq.waveA:sq.waveB).filter(u=>!u.dead&&!u.carry&&!u.covering);
    const holders=(sq.state==="moveA"?sq.waveB:sq.waveA).filter(u=>!u.dead&&!u.carry);
    if(!sq.movingSet){
      sq.movingSet=true;
      const th=predictSpot(sq,now);
      for(const u of holders) if(!u.walk) u.focus={type:"point",x:th.x,y:th.y};   // Ueberwachung
      const pts=spread(sq.next.x,sq.next.y,Math.max(1,movers.length));
      movers.forEach((u,i)=>{
        const q=snapFreeXY(pts[i][0],pts[i][1],compAt(u.x,u.y));
        const r=findPath(u.x,u.y,q[0],q[1]);
        if(r){ startWalk(u,r); u.focus=null; }
      });
    }
    if(movers.every(u=>!u.walk)){
      // angekommen: Fokus auf den wahrscheinlichen Spieler-Spot ("um die Ecke ziehen")
      const th=predictSpot(sq,now);
      for(const u of movers) u.focus={type:"point",x:th.x,y:th.y};
      sq.movingSet=null;
      if(sq.state==="moveA") sq.state="moveB";
      else { sq.state="plan"; sq.nextAt=now+AIP.planPause+Math.random()*AIP.planPauseRnd; }
    }
  }
}
/* Klettern ist laut: Gegner, die es sehen oder hoeren (<=40 m, auch ohne Sichtlinie),
   nehmen automatisch Fokus auf die Stelle – bis das Ziel weg ist, dann alter Fokus zurueck */
function noiseStep(now){
  for(const u of markers){
    if(u.dummy||u.dead) continue;
    const w=u.walk;
    if(!w||!(w.pause>0)) continue;
    for(const e of markers){
      if(!e.dummy||e.dead) continue;
      const d=Math.hypot(e.x-u.x,e.y-u.y);
      if(d>160) continue;
      if(d<=(u.walk.noiseR||40)||canSeeUnit(e,u)){   // Zaun laut, Mauer leise
        if(!e.noise) e.noise={saved:e.focus||null};
        e.noise.until=now+2000;
        e.focus={type:"point",x:u.x,y:u.y,__noise:true};
      }
    }
  }
  for(const e of markers){
    if(!e.dummy||e.dead||!e.noise) continue;
    if(now>=e.noise.until){
      if(e.focus&&e.focus.__noise) e.focus=e.noise.saved;
      e.noise=null;
    }
  }
}
/* Feindkontakt: Spaeher ziehen sich zurueck, Nachschub verlagert sich fuer eine Weile in den Alarmbereich */
let alarm=null;
function enemyContact(s,t,now){
  if(gameMode!=="defusal"&&gameMode!=="ctf") return;
  if(s.role==="scout"&&!s.retreating){
    s.retreating=true; s.walk=null; s.focus=null;
    const sp=s.homeSpot||{x:s.x,y:s.y};
    const [rx,ry]=snapFreeXY(sp.x+(s.x-sp.x)*0.2, sp.y+(s.y-sp.y)*0.2, compAt(sp.x,sp.y));
    s.order={x:rx,y:ry,fx:t.x,fy:t.y,withFocus:true};
    s.role="def"; s.nextAi=0;
  }
  if(!alarm||now>alarm.next){
    alarm={x:t.x,y:t.y,until:now+25000,next:now+12000};
    // 2 Verteidiger ruecken fuer 25 s in Richtung Alarm nach (die naechsten stehen schon gut – nimm die dahinter)
    const helpers=markers.filter(m=>m.dummy&&!m.dead&&m!==s&&m.role==="def"&&!m.tempOrder)
      .sort((a,b)=>Math.hypot(a.x-t.x,a.y-t.y)-Math.hypot(b.x-t.x,b.y-t.y))
      .slice(1,3);
    for(const h of helpers){
      const q=snapFreeXY(t.x+(h.x-t.x)*0.45, t.y+(h.y-t.y)*0.45, compAt(t.x,t.y));
      h.tempOrder={x:q[0],y:q[1],fx:t.x,fy:t.y,withFocus:true,until:now+25000};
      h.focus=null; h.nextAi=0;
    }
  }
}
/* Ziel-Rendering */
function objMark(x,y,col,label,r){
  const g=document.createElementNS(NS,"g");
  const ring=document.createElementNS(NS,"circle");
  ring.setAttribute("class","spotring"); ring.setAttribute("r",r||9);
  ring.setAttribute("cx",x); ring.setAttribute("cy",y); ring.setAttribute("stroke",col);
  g.appendChild(ring);
  const dot=document.createElementNS(NS,"circle");
  dot.setAttribute("r",2.5); dot.setAttribute("cx",x); dot.setAttribute("cy",y); dot.setAttribute("fill",col);
  g.appendChild(dot);
  if(label){
    const t=document.createElementNS(NS,"text");
    t.setAttribute("class","objlbl"); t.setAttribute("x",x+11); t.setAttribute("y",y+3);
    t.setAttribute("fill",col); t.textContent=label;
    g.appendChild(t);
  }
  return g;
}
function flagIcon(x,y,col){
  const g=document.createElementNS(NS,"g");
  g.setAttribute("transform",`translate(${x} ${y})`);
  const p=document.createElementNS(NS,"path");
  p.setAttribute("d","M0 2 L0 -12 L8 -9.5 L0 -7");
  p.setAttribute("fill",col); p.setAttribute("stroke","#fff"); p.setAttribute("stroke-width",1);
  g.appendChild(p);
  return g;
}
function drawObjectives(){
  L.obj.innerHTML="";
  if(phase==="chooseFlag"&&flags&&flags.cand){
    L.obj.appendChild(objMark(flags.cand[0].x,flags.cand[0].y,"#1c1c1a","Position 1",12));
    L.obj.appendChild(objMark(flags.cand[1].x,flags.cand[1].y,"#1c1c1a","Position 2",12));
    L.obj.appendChild(flagIcon(flags.cand[0].x,flags.cand[0].y,"#8d8d86"));
    L.obj.appendChild(flagIcon(flags.cand[1].x,flags.cand[1].y,"#8d8d86"));
  } else if(gameMode==="ctf"&&phase==="play"&&flags){
    L.obj.appendChild(objMark(flags.pHome.x,flags.pHome.y,placeColor,"Deine Basis",12));
    L.obj.appendChild(objMark(flags.eHome.x,flags.eHome.y,ENEMY_COLOR,"Gegner-Basis",12));
    L.obj.appendChild(flagIcon(flags.pFlag.x,flags.pFlag.y,placeColor));
    L.obj.appendChild(flagIcon(flags.eFlag.x,flags.eFlag.y,ENEMY_COLOR));
  } else if(phase==="chooseSet"&&defusal&&defusal.sets){
    const cols=["#b58900","#8a4bc9"];
    defusal.sets.forEach((s,i)=>{
      L.obj.appendChild(objMark(s.a.x,s.a.y,cols[i],"A"+(i+1)));
      L.obj.appendChild(objMark(s.b.x,s.b.y,cols[i],"B"+(i+1)));
      L.obj.appendChild(objMark(s.spawn.x,s.spawn.y,cols[i],"Spawn "+(i+1),13));
    });
  } else if(gameMode==="defusal"&&phase==="play"&&defusal){
    L.obj.appendChild(objMark(defusal.a.x,defusal.a.y,"#b58900","A"));
    L.obj.appendChild(objMark(defusal.b.x,defusal.b.y,"#b58900","B"));
    L.obj.appendChild(objMark(defusal.spawn.x,defusal.spawn.y,ENEMY_COLOR,"Gegner-Spawn"));
    if(defusal.bomb){
      const b=objMark(defusal.bomb.x,defusal.bomb.y,"#c2452d","💣",7);
      L.obj.appendChild(b);
    }
  }
}
/* Start der Modi */
function startCtf(){
  const cands=goodCands(playerComp(),240);
  let best=null;
  for(let a=0;a<cands.length;a+=3) for(let b=a+3;b<cands.length;b+=3){
    const s=Math.hypot(cands[a].x-cands[b].x,cands[a].y-cands[b].y)+(cands[a].cover+cands[b].cover)*18;
    if(!best||s>best.s) best={s,a:cands[a],b:cands[b]};
  }
  if(!best){ setStatus("Keine geeigneten Flaggenpositionen gefunden."); return; }
  flags={cand:[best.a,best.b]};
  phase="chooseFlag";
  drawObjectives();
  setStatus("Capture the Flag: Linksklick auf Position 1 oder 2 = DEINE Flagge (die andere gehört dem Gegner). Rechtsklick verschiebt den nächstgelegenen Punkt.");
}
function chooseFlagAt(i){
  const own=flags.cand[i], en=flags.cand[1-i];
  flags={pHome:own,eHome:en,
         pFlag:{x:own.x,y:own.y,carrier:null,atHome:true},
         eFlag:{x:en.x,y:en.y,carrier:null,atHome:true}};
  teleportUnits(own.x,own.y);
  const n=markers.filter(m=>!m.dummy&&m.color===placeColor).length;
  spawnEnemiesAt(en.x,en.y,n,null,own);
  const ds=markers.filter(m=>m.dummy);
  const atk=ds.filter((m,i2)=>i2%2===0), def=ds.filter((m,i2)=>i2%2===1);
  dangerZones=[]; squads=[]; lastContacts=[];
  strongpoints=computeStrongpoints();
  makeSquads(atk,()=>({x:flags.pFlag.x,y:flags.pFlag.y}));   // Ziel trackt die Flagge live
  assignDefense(def,en);   // Verteidiger beziehen geplante Stellungen um die eigene Flagge
  enemyTotal=n; ownTotal=n;
  phase="play"; combatOn=true; ensureAnim(); updateScore(); updateVision(true); drawObjectives();
  setStatus("CTF läuft: Hol die graue Flagge zu deiner Basis – und pass auf deine auf!");
}
function makeDefSet(cands){
  let best=null;
  for(let t=0;t<400;t++){
    const a=cands[(Math.random()*cands.length)|0], b=cands[(Math.random()*cands.length)|0];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<140||d>500) continue;
    const s=d*0.3+(a.cover+b.cover)*20+Math.random()*30;
    if(!best||s>best.s) best={s,a,b};
  }
  if(!best) return null;
  const [sx,sy]=snapFreeXY((best.a.x+best.b.x)/2,(best.a.y+best.b.y)/2,compAt(best.a.x,best.a.y));
  return {a:best.a,b:best.b,spawn:{x:sx,y:sy}};
}
function startDefusal(){
  const cands=goodCands(playerComp(),240);
  const s1=makeDefSet(cands), s2=makeDefSet(cands);
  if(!s1||!s2){ setStatus("Keine geeigneten Ziel-Konstellationen gefunden."); return; }
  defusal={sets:[s1,s2]};
  phase="chooseSet";
  drawObjectives();
  setStatus("Defusal: Linksklick auf „Spawn 1“/„Spawn 2“ wählt die Konstellation. Rechtsklick verschiebt vorher den nächstgelegenen Punkt (Spots & Spawns).");
}
function chooseSetAt(i){
  const s=defusal.sets[i];
  defusal={a:s.a,b:s.b,spawn:s.spawn,bomb:null,plantP:0};
  // Gegner starten am Spawn und beziehen dann geplante Stellungen an beiden Spots
  const n=Math.max(2,markers.filter(m=>!m.dummy&&m.color===placeColor).length);
  const newDummies=[];
  const spawnCid=compAt(s.spawn.x,s.spawn.y);
  spread(s.spawn.x,s.spawn.y,n).forEach(p=>{
    const q=snapFreeXY(p[0],p[1],spawnCid);
    newDummies.push(makeDummy(q[0],q[1],Math.random()*6.283,"def",null));
  });
  const nA=Math.ceil(n/2);
  assignDefense(newDummies.slice(0,nA), s.a);
  assignDefense(newDummies.slice(nA), s.b);
  enemyTotal=markers.filter(m=>m.dummy).length;
  ownTotal=markers.filter(m=>!m.dummy&&m.color===placeColor).length;
  phase="play"; combatOn=true; ensureAnim(); updateScore(); updateVision(true); drawObjectives();
  setStatus("Defusal läuft: Nimm von deiner Position aus Spot A oder B, bleib dort 4 s (Bombe legen), dann 45 s verteidigen.");
}
function winGame(msg){ gameOver=true; gameMsg=msg; setStatus(msg); }
/* KI-Bewegung */
function wanderNear(m,now,ax,ay,rad){
  if(m.walk) return;
  if(!m.nextAi){ m.nextAi=now+1500+Math.random()*5000; return; }
  if(now<m.nextAi) return;
  m.nextAi=now+3500+Math.random()*7000;
  const a=Math.random()*6.283, d=rad*(0.35+Math.random()*0.65);
  const r=findPath(m.x,m.y,ax+Math.cos(a)*d,ay+Math.sin(a)*d);
  if(r&&r.pts.length>1) startWalk(m,r);
}
function aiStep(now){
  if(gameOver) return;
  for(const sq of squads) squadThink(sq,now);
  for(const m of markers){
    if(!m.dummy||m.dead) continue;
    if(m.covering&&now>m.covering) m.covering=null;
    if(gameMode==="ctf"&&phase==="play"&&flags){
      if(m.carry==="enemy"){
        if(!m.walk&&now>(m.nextAi||0)){ const r=findPath(m.x,m.y,flags.eHome.x,flags.eHome.y); if(r) startWalk(m,r); m.nextAi=now+2500; }
      } else if(m.role==="sq"){
        seekCover(m,now);
      } else aiHoldOrder(m,now);
    } else if(gameMode==="defusal"&&phase==="play"&&defusal){
      if(defusal.bomb){
        if(!m.walk&&now>(m.nextAi||0)&&Math.hypot(m.x-defusal.bomb.x,m.y-defusal.bomb.y)>3.5){
          const r=findPath(m.x,m.y,defusal.bomb.x,defusal.bomb.y); if(r) startWalk(m,r); m.nextAi=now+2500;
        }
      } else aiHoldOrder(m,now);
    } else {
      if(m.role==="sq"){ seekCover(m,now); continue; }
      if(m.patrol) continue;               // Patrouillen macht patrolStep
      wanderNear(m,now,m.x,m.y,110);       // freies Wandern im Scharmützel
    }
  }
}
/* Ziel-Logik pro Frame */
function objTick(now,dtS){
  if(gameOver) return;
  if(gameMode==="ctf"&&phase==="play"&&flags){
    const F=flags;
    for(const fl of [F.pFlag,F.eFlag]){
      if(fl.carrier){
        if(fl.carrier.dead) fl.carrier=null;
        else { fl.x=fl.carrier.x; fl.y=fl.carrier.y; }
      }
    }
    for(const m of markers){
      if(m.dead) continue;
      if(!m.dummy){
        if(!F.eFlag.carrier&&Math.hypot(m.x-F.eFlag.x,m.y-F.eFlag.y)<5){
          F.eFlag.carrier=m; F.eFlag.atHome=false; m.carry="enemy";
          setStatus("Gegnerische Flagge aufgenommen – bring sie heim! (Sicht reduziert)");
        } else if(!F.pFlag.carrier&&!F.pFlag.atHome&&Math.hypot(m.x-F.pFlag.x,m.y-F.pFlag.y)<5){
          F.pFlag.carrier=m; m.carry="own";
          setStatus("Eigene Flagge aufgenommen – zurück zur Basis. (Sicht verbessert)");
        }
      } else {
        if(!F.pFlag.carrier&&Math.hypot(m.x-F.pFlag.x,m.y-F.pFlag.y)<5){
          F.pFlag.carrier=m; F.pFlag.atHome=false; m.carry="enemy";
          setStatus("⚠ Der Gegner hat deine Flagge!");
        }
      }
    }
    if(F.pFlag.carrier&&!F.pFlag.carrier.dummy&&Math.hypot(F.pFlag.x-F.pHome.x,F.pFlag.y-F.pHome.y)<6){
      F.pFlag.carrier.carry=null; F.pFlag.carrier=null;
      F.pFlag.x=F.pHome.x; F.pFlag.y=F.pHome.y; F.pFlag.atHome=true;
      setStatus("Eigene Flagge gesichert.");
    }
    if(F.eFlag.carrier&&!F.eFlag.carrier.dummy&&Math.hypot(F.eFlag.carrier.x-F.pHome.x,F.eFlag.carrier.y-F.pHome.y)<8)
      winGame("🏆 Flagge erobert – GEWONNEN!");
    if(F.pFlag.carrier&&F.pFlag.carrier.dummy&&Math.hypot(F.pFlag.carrier.x-F.eHome.x,F.pFlag.carrier.y-F.eHome.y)<8)
      winGame("Der Gegner hat deine Flagge heimgebracht – verloren.");
    drawObjectives();
  } else if(gameMode==="defusal"&&phase==="play"&&defusal){
    const D=defusal;
    if(!D.bomb){
      let planting=false;
      for(const s of [D.a,D.b]){
        const u=markers.find(m=>!m.dummy&&!m.dead&&!m.walk&&Math.hypot(m.x-s.x,m.y-s.y)<4);
        if(u){
          planting=true;
          D.plantP+=dtS;
          setStatus("Bombe wird gelegt … "+Math.min(100,Math.round(D.plantP/4*100))+" %");
          if(D.plantP>=4){
            D.bomb={x:s.x,y:s.y,timer:45,defuseP:0};
            D.plantP=0;
            for(const m of markers) if(m.dummy&&!m.dead) m.nextAi=0;
            setStatus("💣 Bombe gelegt – 45 s halten!");
          }
          break;
        }
      }
      if(!planting) D.plantP=0;
    } else {
      D.bomb.timer-=dtS;
      const df=markers.find(m=>m.dummy&&!m.dead&&!m.walk&&Math.hypot(m.x-D.bomb.x,m.y-D.bomb.y)<4);
      if(df){
        D.bomb.defuseP+=dtS;
        if(D.bomb.defuseP>=5){
          D.bomb=null;
          for(const m of markers) if(m.dummy&&!m.dead) m.nextAi=0;
          setStatus("Bombe entschärft – du kannst erneut legen.");
        }
      } else if(D.bomb) D.bomb.defuseP=Math.max(0,D.bomb.defuseP-dtS*0.5);
      if(D.bomb){
        if(D.bomb.timer<=0) winGame("💥 Ziel zerstört – GEWONNEN!");
        else {
          const t=Math.ceil(D.bomb.timer);
          if(t!==D.lastT){ D.lastT=t; setStatus((D.bomb.defuseP>0.5?("⚠ Gegner entschärft ("+Math.round(D.bomb.defuseP/5*100)+" %) – "):"💣 ")+t+" s bis zur Detonation"); }
        }
      }
    }
    drawObjectives();
  }
}
function resetGame(){
  combatOn=false; phase="idle"; gameOver=false; gameMsg="";
  flags=null; defusal=null; alarm=null; dangerZones=[]; squads=[]; strongpoints=null; lastContacts=[];
  L.obj.innerHTML="";
  for(const m of [...markers]){
    if(m.dummy){ if(m.g)m.g.remove(); if(m.line)m.line.remove(); markers.splice(markers.indexOf(m),1); }
    else m.carry=null;
  }
  document.getElementById("btnStart").textContent="▶ Start";
  L.comp.style.display="";
  document.getElementById("score").style.display="none";
  updateVision();
  setStatus("Spiel beendet.");
}
document.getElementById("btnStart").onclick=()=>{
  const btn=document.getElementById("btnStart");
  if(combatOn||phase!=="idle"){ resetGame(); return; }
  const own=markers.filter(m=>!m.dummy&&m.color===placeColor);
  if(!own.length){ setStatus("Erst eigene Einheiten setzen (📍)."); return; }
  gameMode=document.getElementById("mode").value;
  gameOver=false; gameMsg="";
  L.comp.style.display="none";
  btn.textContent="⏹ Beenden";
  if(gameMode==="ctf"){ startCtf(); return; }
  if(gameMode==="defusal"){ startDefusal(); return; }
  const n=own.length;
  const placed=spawnDummies(n);
  if(!placed){ setStatus("Keine Spawn-Plätze im gewählten Bereich gefunden."); btn.textContent="▶ Start"; L.comp.style.display=""; return; }
  // Scharmuetzel: 2/3 der Gegner ruecken als Trupps auf die Spieler vor, Rest patrouilliert
  dangerZones=[]; squads=[]; lastContacts=[];
  strongpoints=computeStrongpoints();
  const freeD=markers.filter(m=>m.dummy&&!m.patrol);
  makeSquads(freeD.slice(0,Math.ceil(freeD.length*0.67)),()=>playerCentroid());
  phase="play"; combatOn=true; ensureAnim();
  enemyTotal=placed;
  ownTotal=markers.filter(m=>!m.dummy).length;
  updateScore();
  setStatus(placed+" Gegner platziert. Deine Einheiten feuern nur mit Fokus oder unter Beschuss.");
};

/* Bewegung */
let animOn=false, lastT=0;
function ensureAnim(){ if(!animOn){ animOn=true; lastT=performance.now(); requestAnimationFrame(tick); } }
function walkPoint(w,d){
  let i=1;
  while(i<w.cum.length&&w.cum[i]<d) i++;
  if(i>=w.cum.length) return w.pts[w.pts.length-1];
  const t=(d-w.cum[i-1])/Math.max(1e-9,w.cum[i]-w.cum[i-1]);
  return [w.pts[i-1][0]+(w.pts[i][0]-w.pts[i-1][0])*t, w.pts[i-1][1]+(w.pts[i][1]-w.pts[i-1][1])*t];
}
function tick(now){
  const dtS=Math.min(0.1,(now-lastT)/1000); lastT=now;
  let any=false, climbing=false, moving=0, remTot=0;
  for(const m of markers){
    const w=m.walk;
    if(!w) continue;
    any=true;
    if(w.pause>0){ w.pause-=dtS; climbing=true; }
    else{
      w.dist+=WSPEED*speedFactor(flagsAt(m.x,m.y))*dtS;
      if(w.evI<w.events.length&&w.dist>=w.events[w.evI].at){ const ev=w.events[w.evI]; w.dist=ev.at; w.evI++; w.pause=ev.d; w.noiseR=ev.nr; }
      if(w.dist>=w.total){
        const end=w.pts[w.pts.length-1];
        m.x=end[0]; m.y=end[1];
        m.walk=null; m.walkDir=null;
        drawRouteFor(m,null); drawMarkerEl(m);
        continue;
      }
    }
    const p=walkPoint(w,w.dist);
    if(Math.hypot(p[0]-m.x,p[1]-m.y)>1e-6) m.walkDir=Math.atan2(p[1]-m.y,p[0]-m.x);
    m.x=p[0]; m.y=p[1];
    drawMarkerEl(m);
    // Routenlinie nur fuer eigene Einheiten und gedrosselt (Pfad-Strings sind teuer)
    if(!m.dummy&&(!w.lastRT||now-w.lastRT>=150)){
      w.lastRT=now;
      let i=1; while(i<w.cum.length&&w.cum[i]<w.dist) i++;
      drawRouteFor(m,[p,...w.pts.slice(i)]);
    }
    moving++; remTot+=w.total-w.dist;
  }
  if(combatOn&&!gameOver){ aiStep(now); patrolStep(now); combatStep(now); noiseStep(now); objTick(now,dtS); }
  if(gameOver&&gameMsg) setStatus(gameMsg);
  if(any||combatOn){
    updateVision();
    if(any){
      const ownMoving=markers.some(m=>m.walk&&!m.dummy);
      if(ownMoving) setStatus(climbing?"Klettert über Hindernis …":("Unterwegs – "+moving+" Einheit(en), insgesamt noch "+Math.round(remTot)+" m"));
    }
    requestAnimationFrame(tick);
  } else {
    animOn=false;
    setStatus("Angekommen.");
    setTimeout(()=>{ if(!animOn&&!sel.size&&!placeMode) setStatus(null); },2500);
  }
}

/* Tastatur-Navigation (WASD/Pfeile) + Esc */
const panKeys=new Set();
const KEYMAP={w:[0,1],W:[0,1],ArrowUp:[0,1],s:[0,-1],S:[0,-1],ArrowDown:[0,-1],a:[1,0],A:[1,0],ArrowLeft:[1,0],d:[-1,0],D:[-1,0],ArrowRight:[-1,0]};
let panAnim=false, panLast=0;
function panTick(now){
  if(!panKeys.size){ panAnim=false; return; }
  const dtS=Math.min(0.05,(now-panLast)/1000); panLast=now;
  let dx=0, dy=0;
  for(const k2 of panKeys){ const v=KEYMAP[k2]; if(v){ dx+=v[0]; dy+=v[1]; } }
  const st=area?dt:ov;
  st.tx+=dx*700*dtS; st.ty+=dy*700*dtS;
  st.apply();
  requestAnimationFrame(panTick);
}
addEventListener("keydown",e=>{
  if(KEYMAP[e.key]){
    e.preventDefault();
    panKeys.add(e.key);
    if(!panAnim){ panAnim=true; panLast=performance.now(); requestAnimationFrame(panTick); }
    return;
  }
  if((e.key==="r"||e.key==="R")&&area&&sel.size){ clearFocus(); return; }
  if(e.key==="Escape"){
    placeMode=false; btnMk.classList.remove("active");
    document.getElementById("dt").classList.remove("place");
    ov.boxMode=false; btnBox.classList.remove("active");
    document.getElementById("ov").classList.remove("boxmode");
    sel.clear(); redrawMarkers();
    if(area) updateVision();
    setStatus(null);
  }
});
addEventListener("keyup",e=>{ panKeys.delete(e.key); });
addEventListener("blur",()=>panKeys.clear());

/* Karte als Datei sichern / laden (funktioniert auch, wenn IndexedDB blockiert ist) */
document.getElementById("btnSave").onclick=()=>{
  if(!window.curArea) return;
  const blob=new Blob([JSON.stringify(window.curArea)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="einsatzkarte-"+(window.curArea.label||"bereich").replace(/[^a-zA-Z0-9äöüÄÖÜß-]+/g,"_")+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  setStatus("Bereich als Datei gespeichert (Downloads-Ordner). Über „Karte aus Datei laden“ in der Übersicht wieder öffnen.");
};
document.getElementById("fileload").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const j=JSON.parse(rd.result);
      if(j&&j.data&&j.S!=null) loadArea(j.S,j.W,j.N,j.E,j.data);
      else setStatus("Datei hat kein gültiges Einsatzkarten-Format.");
    }catch(err){ setStatus("Datei konnte nicht gelesen werden."); }
  };
  rd.readAsText(f);
  e.target.value="";
});
document.getElementById("zin").onclick=()=>{ (area?dt:ov).zoomAt(innerWidth/2,innerHeight/2,1.5); };
document.getElementById("zout").onclick=()=>{ (area?dt:ov).zoomAt(innerWidth/2,innerHeight/2,1/1.5); };
addEventListener("resize",()=>{ if(!area) updateOvTiles(); });

/* Start */
fitGermany();
updateOvTiles();
renderSaved();
setStatus("Mit „▭ Bereich wählen“ ein Rechteck aufziehen – dieser Ausschnitt wird als Einsatzgebiet geladen.");
</script>
