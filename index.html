<style>
:root{
  --paper:#f3f1ea; --ink:#2c3227; --ink-soft:#6b7060; --line:#c9cbba; --panel:#fbfaf4;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:#bfcdd4; color:var(--ink); font-family:Archivo,system-ui,sans-serif; overflow:hidden}
.stage{position:fixed; inset:0; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-user-drag:none}
.stage.dragging{cursor:grabbing}
.stage.boxmode{cursor:crosshair}
.stage.place{cursor:crosshair}
#dt{cursor:default}
svg{display:block; width:100%; height:100%}
.card{position:fixed; background:var(--panel); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow)}
#topbar{top:12px; left:12px; z-index:5; padding:8px 12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; max-width:calc(100vw - 24px)}
#topbar .ttl{font-weight:700; font-size:15px; margin-right:4px}
#topbar button{border:1px solid var(--line); background:#fff; color:var(--ink); font:600 12.5px Archivo,sans-serif; border-radius:7px; padding:6px 11px; cursor:pointer}
#topbar button:hover{background:var(--accent-soft)}
#topbar button.active{background:var(--accent); color:#fff; border-color:var(--accent)}
#colors{display:flex; gap:5px; align-items:center}
#colors .cw{width:22px; height:22px; border-radius:50%; border:2px solid #fff; outline:1px solid var(--line); cursor:pointer; padding:0}
#colors .cw.active{outline:2.5px solid var(--ink)}
#status{bottom:12px; left:50%; transform:translateX(-50%); z-index:6; padding:8px 16px; font:600 12.5px Archivo,sans-serif; max-width:min(620px,88vw); text-align:center; display:none}
#saved{top:64px; left:12px; z-index:5; padding:10px 12px; width:300px; max-height:62vh; overflow-y:auto; display:none}
#saved .cap{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:6px}
.srow{display:flex; align-items:center; gap:6px; border-top:1px solid #eceade; padding:6px 0}
.srow:first-of-type{border-top:none}
.srow .load{flex:1; text-align:left; border:none; background:none; color:var(--ink); font:500 12px Archivo,sans-serif; cursor:pointer; padding:0}
.srow .load:hover{color:var(--accent)}
.srow .load .sub{display:block; font-size:10.5px; color:var(--ink-soft)}
.srow .ic{border:none; background:none; cursor:pointer; font-size:14px; padding:2px 4px; opacity:.55}
.srow .ic:hover{opacity:1}
.srow .ic.pinned{opacity:1}
#attrib{position:fixed; right:6px; bottom:4px; z-index:4; font:400 10px Archivo,sans-serif; color:#4b524a; background:#ffffffb0; padding:1px 6px; border-radius:4px}
#selrect{position:fixed; border:2px dashed var(--accent); background:#c2452d15; z-index:5; display:none; pointer-events:none}
#uiov{position:fixed; inset:0; z-index:5; pointer-events:none}
#rcur{position:fixed; z-index:9; pointer-events:none; display:none; transform:translate(-14px,-14px)}
#cmdline{fill:none; stroke:var(--accent); stroke-width:2.5; stroke-dasharray:8 6; display:none}
.framerect{fill:none; stroke:#b3402e; stroke-width:2.5; vector-effect:non-scaling-stroke; stroke-dasharray:10 6}
#zoomctl{bottom:12px; right:12px; z-index:5; display:flex; flex-direction:column; overflow:hidden; border-radius:8px}
#zoomctl button{width:38px; height:38px; border:none; border-bottom:1px solid var(--line); background:transparent; color:var(--ink); font-size:19px; cursor:pointer}
#zoomctl button:last-child{border-bottom:none}

.mring{fill:none; stroke-width:1.6; stroke-dasharray:3 3; opacity:.9}

<script>
"use strict";
const NS="http://www.w3.org/2000/svg";
const statusEl=document.getElementById("status");
function setStatus(t){ if(!t){statusEl.style.display="none";return;} statusEl.textContent=t; statusEl.style.display="block"; }
const OSRV=["https://maps.mail.ru/osm/tools/overpass/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass-api.de/api/interpreter"];
async function overpass(q, onTry){
  for(let i=0;i<OSRV.length;i++){
    if(onTry) onTry(i+1,OSRV.length);
    const ctl=new AbortController();
    const to=setTimeout(()=>ctl.abort(),25000);
    try{
      const r=await fetch(OSRV[i]+"?data="+encodeURIComponent(q),{signal:ctl.signal});
      clearTimeout(to);
      if(!r.ok) throw 0;
      return await r.json();
    }catch(e){ clearTimeout(to); }
  }
  return null;
}

/* ============ Pan/Zoom-Controller ============ */
function makeStage(el, opts){
  opts=opts||{};
  const svg=document.createElementNS(NS,"svg");
  const root=document.createElementNS(NS,"g");
  svg.appendChild(root); el.appendChild(svg);
  const st={el, svg, root, k:1, tx:0, ty:0, minK:0.01, maxK:1e9, leftPan:opts.leftPan!==false,
            boxMode:false, onChange:null, onClick:null, onDblClick:null, onBox:null,
            onLeftDragMove:null, onLeftDragEnd:null, onRightUp:null, onRightDown:null, onRightDragMove:null};
  let rightT0=0;
  function apply(){
    root.setAttribute("transform",`translate(${st.tx} ${st.ty}) scale(${st.k})`);
    if(st.onChange) st.onChange();
  }
  st.apply=apply;
  st.zoomAt=(cx,cy,f)=>{
    const k2=Math.min(st.maxK,Math.max(st.minK,st.k*f));
    const r=k2/st.k;
    st.tx=cx-(cx-st.tx)*r; st.ty=cy-(cy-st.ty)*r; st.k=k2;
    apply();
  };
  el.addEventListener("wheel",e=>{ e.preventDefault(); st.zoomAt(e.clientX,e.clientY,Math.pow(1.0015,-e.deltaY)); },{passive:false});
  el.addEventListener("dragstart",e=>e.preventDefault());
  el.addEventListener("contextmenu",e=>e.preventDefault());
  const ptrs=new Map();
  let pinch=0, gtype=null, start=null, moved=false;
  const selrect=document.getElementById("selrect");
  el.addEventListener("pointerdown",e=>{
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){
      moved=false; start={x:e.clientX,y:e.clientY};
      if(st.boxMode&&e.button===0) gtype="box";
      else if(e.button===1) gtype="pan";
      else if(e.button===0) gtype=st.leftPan?"pan":"left";
      else if(e.button===2){ gtype="right"; rightT0=performance.now(); if(st.onRightDown) st.onRightDown(e.clientX,e.clientY); }
      else gtype=null;
      if(gtype==="pan") el.classList.add("dragging");
    } else if(ptrs.size===2){
      gtype="pinch";
      const [a,b]=[...ptrs.values()]; pinch=Math.hypot(a.x-b.x,a.y-b.y);
    }
  });
  el.addEventListener("pointermove",e=>{
    if(!ptrs.has(e.pointerId)) return;
    const p=ptrs.get(e.pointerId);
    const dx=e.clientX-p.x, dy=e.clientY-p.y;
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(Math.abs(e.clientX-start.x)+Math.abs(e.clientY-start.y)>4) moved=true;
    if(gtype==="pinch"&&ptrs.size===2){
      const [a,b]=[...ptrs.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(pinch>0) st.zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinch);
      pinch=d;
      return;
    }
    if(gtype==="pan"){ st.tx+=dx; st.ty+=dy; apply(); }
    else if(gtype==="box"&&moved){
      const x0=Math.min(start.x,e.clientX), y0=Math.min(start.y,e.clientY);
      selrect.style.display="block";
      selrect.style.left=x0+"px"; selrect.style.top=y0+"px";
      selrect.style.width=Math.abs(e.clientX-start.x)+"px";
      selrect.style.height=Math.abs(e.clientY-start.y)+"px";
      if(st.onBoxMove) st.onBoxMove(start.x,start.y,e.clientX,e.clientY);
    }
    else if(gtype==="left"&&moved&&st.onLeftDragMove){
      st.onLeftDragMove(start.x,start.y,e.clientX,e.clientY);
    }
    else if(gtype==="right"&&moved&&st.onRightDragMove){
      st.onRightDragMove(start.x,start.y,e.clientX,e.clientY);
    }
  });
  function up(e){
    const had=ptrs.delete(e.pointerId);
    if(ptrs.size===0) el.classList.remove("dragging");
    if(!had) return;
    if(gtype==="pinch"){ pinch=0; if(ptrs.size<2) gtype=null; return; }
    const g=gtype; gtype=null;
    if(g==="box"){
      selrect.style.display="none";
      if(moved&&st.onBox) st.onBox(start.x,start.y,e.clientX,e.clientY);
      return;
    }
    if(g==="left"){
      if(moved){ if(st.onLeftDragEnd) st.onLeftDragEnd(start.x,start.y,e.clientX,e.clientY); }
      else if(st.onClick) st.onClick(e.clientX,e.clientY);
      return;
    }
    if(g==="right"){
      if(st.onRightUp) st.onRightUp(e.clientX,e.clientY,performance.now()-rightT0,moved);
      return;
    }
    if(g==="pan"&&!moved&&st.leftPan&&st.onClick&&e.button===0) st.onClick(e.clientX,e.clientY);
  }
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",e=>{ ptrs.delete(e.pointerId); pinch=0; gtype=null; selrect.style.display="none"; el.classList.remove("dragging"); });
  el.addEventListener("dblclick",e=>{ if(st.onDblClick) st.onDblClick(e.clientX,e.clientY); });
  return st;
}

/* ============ Stufe A: Uebersicht ============ */
const MSC=40000, OX=19000, OY=12800;
const PXo=lon=>(lon+180)/360*MSC-OX;
const PYo=lat=>{const r=lat*Math.PI/180; return (1-Math.asinh(Math.tan(r))/Math.PI)/2*MSC-OY;};
const LONo=x=>(x+OX)/MSC*360-180;
const LATo=y=>Math.atan(Math.sinh(Math.PI*(1-2*(y+OY)/MSC)))*180/Math.PI;

const ov=makeStage(document.getElementById("ov"),{leftPan:true});
const ovTiles=document.createElementNS(NS,"g");
ov.root.appendChild(ovTiles);
const tileMap=new Map();
let tileTimer=0;
function ovTileURL(z,x,y){
  if(z<=13) return `https://${"abc"[(x+y)%3]}.tile.opentopomap.org/${z}/${x}/${y}.png`;
  return `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
}
function updateOvTiles(){
  const dpr=window.devicePixelRatio||1;
  const z=Math.max(5,Math.min(14,Math.round(Math.log2(MSC*ov.k/256))+(dpr>1.5?1:0)));
  const n=1<<z, ts=MSC/n;
  const wx0=(-ov.tx)/ov.k+OX, wy0=(-ov.ty)/ov.k+OY;
  const wx1=(innerWidth-ov.tx)/ov.k+OX, wy1=(innerHeight-ov.ty)/ov.k+OY;
  const x0=Math.max(0,Math.floor(wx0/ts)-1), x1=Math.min(n-1,Math.floor(wx1/ts)+1);
  const y0=Math.max(0,Math.floor(wy0/ts)-1), y1=Math.min(n-1,Math.floor(wy1/ts)+1);
  if((x1-x0+1)*(y1-y0+1)>140) return;
  const want=new Set();
  for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++){
    const key=z+"/"+x+"/"+y; want.add(key);
    if(tileMap.has(key)) continue;
    const img=document.createElementNS(NS,"image");
    img.setAttribute("href",ovTileURL(z,x,y));
    img.setAttribute("x",x*ts-OX); img.setAttribute("y",y*ts-OY);
    img.setAttribute("width",ts); img.setAttribute("height",ts);
    img.setAttribute("preserveAspectRatio","none");
    img.addEventListener("error",()=>{ img.remove(); tileMap.delete(key); });
    ovTiles.appendChild(img); tileMap.set(key,img);
  }
  for(const [key,img] of tileMap){ if(!want.has(key)){ img.remove(); tileMap.delete(key); } }
}
ov.onChange=()=>{ clearTimeout(tileTimer); tileTimer=setTimeout(updateOvTiles,120); };
function fitGermany(){
  const x0=PXo(5.8), x1=PXo(15.1), y0=PYo(55.2), y1=PYo(47.2);
  const k=Math.min(innerWidth/(x1-x0), innerHeight/(y1-y0))*0.97;
  ov.minK=k*0.7; ov.maxK=k*400;
  ov.k=k;
  ov.tx=(innerWidth-(x1-x0)*k)/2 - x0*k;
  ov.ty=(innerHeight-(y1-y0)*k)/2 - y0*k;
  ov.apply();
}
const btnBox=document.getElementById("btnBox");
btnBox.onclick=()=>{
  ov.boxMode=!ov.boxMode;
  btnBox.classList.toggle("active",ov.boxMode);
  document.getElementById("ov").classList.toggle("boxmode",ov.boxMode);
  setStatus(ov.boxMode?"Rechteck über den gewünschten Bereich ziehen (Kantenlänge max. ca. 2 km).":null);
};
const MAXSIDE=3000;
function boxDims(sx0,sy0,sx1,sy1){
  const lon0=LONo((Math.min(sx0,sx1)-ov.tx)/ov.k), lon1=LONo((Math.max(sx0,sx1)-ov.tx)/ov.k);
  const latN=LATo((Math.min(sy0,sy1)-ov.ty)/ov.k), latS=LATo((Math.max(sy0,sy1)-ov.ty)/ov.k);
  const cos0=Math.cos((latN+latS)/2*Math.PI/180);
  return {lon0,lon1,latN,latS, wm:(lon1-lon0)*111320*cos0, hm:(latN-latS)*110574};
}
ov.onBoxMove=(sx0,sy0,sx1,sy1)=>{
  const d=boxDims(sx0,sy0,sx1,sy1);
  const over=d.wm>MAXSIDE||d.hm>MAXSIDE;
  document.getElementById("selrect").style.borderColor=over?"#c2452d":"#2d9c57";
  setStatus(`Auswahl: ${(d.wm/1000).toFixed(2)} × ${(d.hm/1000).toFixed(2)} km ${over?"– zu groß! Maximum "+(MAXSIDE/1000).toFixed(1)+" km je Kante":"(max. "+(MAXSIDE/1000).toFixed(1)+" × "+(MAXSIDE/1000).toFixed(1)+" km)"}`);
};
ov.onBox=(sx0,sy0,sx1,sy1)=>{
  document.getElementById("selrect").style.borderColor="";
  const d=boxDims(sx0,sy0,sx1,sy1);
  const {lon0,lon1,latN,latS,wm,hm}=d;
  if(wm>MAXSIDE||hm>MAXSIDE){ setStatus(`Bereich zu groß (${(wm/1000).toFixed(1)} × ${(hm/1000).toFixed(1)} km) – Maximum ${(MAXSIDE/1000).toFixed(1)} km je Kante.`); return; }
  if(wm<120||hm<120){ setStatus("Bereich sehr klein – bitte etwas größer aufziehen."); return; }
  ov.boxMode=false; btnBox.classList.remove("active");
  document.getElementById("ov").classList.remove("boxmode");
  loadArea(latS,lon0,latN,lon1);
};

/* ============ Karten-Cache (IndexedDB, letzte 10 + gepinnte) ============ */
let _db=null, idbError=null;
function idb(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const to=setTimeout(()=>{ idbError=idbError||"Zeitüberschreitung – Datenbank für diese Datei blockiert"; rej(idbError); },2000);
    let rq;
    try{ rq=indexedDB.open("einsatzkarte",1); }
    catch(e){ clearTimeout(to); idbError=e; return rej(e); }
    rq.onupgradeneeded=()=>rq.result.createObjectStore("maps",{keyPath:"id"});
    rq.onsuccess=()=>{ clearTimeout(to); _db=rq.result; idbError=null; res(_db); };
    rq.onerror=()=>{ clearTimeout(to); idbError=rq.error; rej(rq.error); };
  });
}
function idbAll(){ return idb().then(d=>new Promise((res,rej)=>{ const rq=d.transaction("maps").objectStore("maps").getAll(); rq.onsuccess=()=>res(rq.result||[]); rq.onerror=()=>rej(rq.error); })).catch(()=>[]); }
function idbPut(rec){ return idb().then(d=>new Promise((res,rej)=>{ const tx=d.transaction("maps","readwrite"); tx.objectStore("maps").put(rec); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); })).catch(()=>{}); }
function idbDel(id){ return idb().then(d=>new Promise((res,rej)=>{ const tx=d.transaction("maps","readwrite"); tx.objectStore("maps").delete(id); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); })).catch(()=>{}); }
async function saveCache(S,W,N,E,data,label){
  const key=r=>[r.S.toFixed(4),r.W.toFixed(4),r.N.toFixed(4),r.E.toFixed(4)].join("|");
  const all=await idbAll();
  const me={S,W,N,E};
  const old=all.find(r=>key(r)===key(me));
  const rec={id:old?old.id:Date.now(), ts:Date.now(), pinned:old?old.pinned:false,
             S,W,N,E, label, size:JSON.stringify(data).length, data};
  await idbPut(rec);
  // nur die letzten 10 ungepinnten behalten
  const rest=(await idbAll()).filter(r=>!r.pinned).sort((a,b)=>b.ts-a.ts);
  for(const r of rest.slice(10)) await idbDel(r.id);
  renderSaved();
}
async function renderSaved(){
  const box=document.getElementById("saved");
  const list=document.getElementById("savedlist");
  const all=(await idbAll()).sort((a,b)=>(b.pinned-a.pinned)||(b.ts-a.ts));
  if(area){ box.style.display="none"; return; }
  if(idbError){
    box.style.display="block";
    list.innerHTML='<div style="font:400 11.5px Archivo,sans-serif;color:var(--ink-soft)">Karten-Speicher nicht verfügbar – der Browser blockiert die Datenbank für diese Datei ('+String(idbError).replace(/[<>&]/g,"")+'). Tipp: Datei auf ein lokales Laufwerk (z. B. C:) kopieren und von dort öffnen.</div>';

  if(!all.length){

    list.innerHTML='<div style="font:400 11.5px Archivo,sans-serif;color:var(--ink-soft)">Noch keine Bereiche geladen – der nächste geladene Bereich wird hier gespeichert (die letzten 10, 📌 dauerhaft).</div>';
    return;
  }
  box.style.display="block";
  list.innerHTML="";
  for(const r of all){
    const cos0=Math.cos((r.S+r.N)/2*Math.PI/180);
    const wm=((r.E-r.W)*111320*cos0/1000).toFixed(1), hm=((r.N-r.S)*110574/1000).toFixed(1);
    const row=document.createElement("div");

    b.onclick=async()=>{ r.ts=Date.now(); await idbPut(r); loadArea(r.S,r.W,r.N,r.E,r.data); };
    const pin=document.createElement("button");
    pin.className="ic"+(r.pinned?" pinned":"");
    pin.textContent="📌"; pin.title=r.pinned?"Nicht mehr dauerhaft speichern":"Dauerhaft speichern (zählt nicht zu den letzten 10)";
    pin.onclick=async()=>{ r.pinned=!r.pinned; await idbPut(r); renderSaved(); };
    const del=document.createElement("button");
    del.className="ic"; del.textContent="🗑"; del.title="Löschen";
    del.onclick=async()=>{ await idbDel(r.id); renderSaved(); };
    row.appendChild(b); row.appendChild(pin); row.appendChild(del);
    list.appendChild(row);
  }
}

const dt=makeStage(document.getElementById("dt"),{leftPan:false});
{ // Fog-of-War-Maske: weiss = Nebel, schwarze Sichtpolygone stanzen Loecher

let area=null;
const L={};
for(const n of ["bg","green","water","bld","passage","barrier","fence","caseMaj","caseMin","roadMaj","roadMin","paths","rail","rlbl","poi","comp","frame","vision","know","obj","focus","walk"]){
  const g=document.createElementNS(NS,"g"); dt.root.appendChild(g); L[n]=g;
}
const MAJ=/^(motorway|trunk|primary|secondary|tertiary)(_link)?$/;
const PTH=/^(footway|path|cycleway|steps|track|bridleway)$/;
const roadW=h=>/motorway/.test(h)?13:/trunk|primary/.test(h)?10:/secondary/.test(h)?8.5:/tertiary/.test(h)?7:/pedestrian/.test(h)?6:/service/.test(h)?3.5:5;
const isPassage=tg=>tg.tunnel==="building_passage"||tg.covered==="yes"||tg.covered==="arcade"||tg.tunnel==="yes";

function clearDetail(){
  for(const g of Object.values(L)) g.innerHTML="";
  markers.length=0; sel.clear();
}
async function loadArea(S,W,N,E,cached){
  const bb=`(${S.toFixed(6)},${W.toFixed(6)},${N.toFixed(6)},${E.toFixed(6)})`;
  const q=`[out:json][timeout:90];(
way["building"]${bb};
way["highway"]${bb};
way["railway"~"^(rail|tram|light_rail)$"]${bb};
way["barrier"]${bb};
way["amenity"="parking"]${bb};
way["natural"~"^(water|wood|scrub)$"]${bb};
way["waterway"="riverbank"]${bb};
way["landuse"~"^(forest|grass|meadow|cemetery|allotments|orchard|vineyard|recreation_ground|village_green)$"]${bb};
way["leisure"~"^(park|pitch|garden|playground|sports_centre|golf_course)$"]${bb};
relation["building"]${bb};
relation["natural"="water"]${bb};
relation["leisure"~"^(park|garden)$"]${bb};
relation["landuse"~"^(forest|grass|meadow|cemetery)$"]${bb};
node["historic"]["name"]${bb};way["historic"]["name"]${bb};
node["tourism"~"^(attraction|museum|viewpoint)$"]["name"]${bb};way["tourism"~"^(attraction|museum)$"]["name"]${bb};
node["amenity"~"^(place_of_worship|townhall|marketplace|theatre)$"]["name"]${bb};way["amenity"~"^(place_of_worship|townhall|marketplace|theatre)$"]["name"]${bb};
);out geom 80000;`;
  let data=cached||null;
  if(!data){
    data=await overpass(q,(i,n)=>setStatus(`Lade Kartendaten aus OpenStreetMap … (Server ${i}/${n}, einmalig)`));
    if(!data){ setStatus("OSM-Daten nicht erreichbar – bitte erneut versuchen (Datei muss lokal geöffnet sein)."); return; }
  }
  setStatus("Baue Karte und Wegenetz …");
  await new Promise(r=>setTimeout(r,30));
  clearDetail();
  const lat0=(S+N)/2, cos0=Math.cos(lat0*Math.PI/180);
  const mLat=110574, mLon=111320*cos0;
  const Wm=(E-W)*mLon, Hm=(N-S)*mLat;
  area={S,W,N,E,mLat,mLon,Wm,Hm};
  const X=lon=>(lon-W)*mLon, Y=lat=>(N-lat)*mLat;
  const ptsOf=el=>el.geometry.map(g2=>[X(g2.lon),Y(g2.lat)]);
  // Wichtigkeit eines benannten Merkmals (0 = gar nicht beschriften)
  const poiPrio=tg=>{
    if(tg.historic){
      if(/^(memorial|wayside_cross|wayside_shrine|stolperstein|blue_plaque|ghost_bike|boundary_stone|milestone|highwater_mark)$/.test(tg.historic)) return 0;
      if(/^(castle|fort|citywalls|city_gate|tower|church|monastery|ruins|monument|archaeological_site)$/.test(tg.historic)) return 3;
      return 1;
    }
    if(tg.amenity==="place_of_worship"||tg.amenity==="townhall"||tg.amenity==="theatre") return 3;
    if(tg.amenity==="marketplace") return 2;
    if(tg.tourism==="museum") return 3;
    if(tg.tourism==="viewpoint") return 2;
    return 1;
  };
  const blds=[], bldInner=[], barriers=[], waters=[], waterInner=[], greens=[], forests=[], roads=[], rails=[], pois=[], passages=[], parkings=[];
  // Multipolygon-Relationen: Mitglieds-Wege zu Ringen zusammensetzen
  function assembleRings(members){
    const src={outer:[],inner:[]};
    for(const mm of (members||[])){
      if(mm.type!=="way"||!mm.geometry) continue;
      const role=mm.role==="inner"?"inner":"outer";
      src[role].push(mm.geometry.map(g2=>[X(g2.lon),Y(g2.lat)]));
    }
    const out={outer:[],inner:[]};
    const close=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1])<0.5;
    for(const role of ["outer","inner"]){
      const ways=src[role], used=new Array(ways.length).fill(false);
      for(let i=0;i<ways.length;i++){
        if(used[i]) continue;
        used[i]=true;
        let ring=[...ways[i]], guard=0;
        while(!close(ring[0],ring[ring.length-1]) && guard++<=ways.length){
          let found=false;
          for(let j2=0;j2<ways.length;j2++){
            if(used[j2]) continue;
            const w2=ways[j2];
            if(close(ring[ring.length-1],w2[0])){ ring=ring.concat(w2.slice(1)); used[j2]=true; found=true; break; }
            if(close(ring[ring.length-1],w2[w2.length-1])){ ring=ring.concat([...w2].reverse().slice(1)); used[j2]=true; found=true; break; }
          }
          if(!found) break;
        }
        if(ring.length>=4) out[role].push(ring);
      }
    }
    return out;
  }
  for(const el of (data.elements||[])){
    const tg=el.tags||{};
    if(el.type==="relation"&&el.members){
      const rg=assembleRings(el.members);
      if(tg.building){ blds.push(...rg.outer); bldInner.push(...rg.inner); }
      else if(tg.natural==="water"){ waters.push(...rg.outer); waterInner.push(...rg.inner); }
      else if(tg.natural==="wood"||tg.landuse==="forest"){ forests.push(...rg.outer); }
      else if(tg.leisure||tg.landuse){ greens.push(...rg.outer, ...rg.inner); }
      continue;
    }
    if(el.type==="way"&&el.geometry){
      const p=ptsOf(el);
      if(tg.building) blds.push(p);
      else if(tg.highway){
        const r={p,h:tg.highway,name:tg.name||""};
        roads.push(r);
        if(isPassage(tg)) passages.push(r);
      }
      else if(tg.railway) rails.push(p);
      else if(tg.barrier) barriers.push(p);
      else if(tg.amenity==="parking") parkings.push(p);
      else if(tg.natural==="water"||tg.waterway) waters.push(p);
      else if(tg.natural==="wood"||tg.landuse==="forest") forests.push(p);
      else if(tg.natural==="scrub"||tg.landuse||tg.leisure) greens.push(p);
      if((tg.historic||tg.tourism||tg.amenity)&&tg.name&&!tg.highway){
        const cx=p.reduce((s,q2)=>s+q2[0],0)/p.length, cy=p.reduce((s,q2)=>s+q2[1],0)/p.length;
        pois.push({x:cx,y:cy,name:tg.name,prio:poiPrio(tg)});
      }
    } else if(el.type==="node"&&el.lat!=null){
      if((tg.historic||tg.tourism||tg.amenity)&&tg.name) pois.push({x:X(el.lon),y:Y(el.lat),name:tg.name,prio:poiPrio(tg)});
    }
  }
  const bg=document.createElementNS(NS,"rect");
  bg.setAttribute("x",-Wm); bg.setAttribute("y",-Hm);
  bg.setAttribute("width",Wm*3); bg.setAttribute("height",Hm*3);
  bg.setAttribute("fill","#f3f1ea");
  L.bg.appendChild(bg);
  const dOf=(list,close)=>list.map(p=>{
    let d="M"+p.map(q2=>q2[0].toFixed(1)+" "+q2[1].toFixed(1)).join("L");
    return close?d+"Z":d;
  }).join("");
  const addPath=(g,cls,d,extra)=>{
    if(!d) return;
    const p=document.createElementNS(NS,"path");
    p.setAttribute("class",cls); p.setAttribute("d",d);
    if(extra) for(const [k2,v] of Object.entries(extra)) p.setAttribute(k2,v);
    g.appendChild(p);
  };
  addPath(L.green,"green",dOf(greens,true),{"fill-rule":"evenodd"});
  addPath(L.green,"parking",dOf(parkings,true),{fill:"#d9dde1",stroke:"#c3c8cd","stroke-width":"0.6"});
  addPath(L.green,"forest",dOf(forests,true),{"fill-rule":"evenodd"});
  addPath(L.water,"water",dOf(waters.concat(waterInner),true),{"fill-rule":"evenodd"});
  addPath(L.bld,"bld",dOf(blds.concat(bldInner),true),{"fill-rule":"evenodd"});
  // Durchfahrten halbtransparent UEBER den Gebaeuden
  addPath(L.passage,"passage",dOf(passages.map(r=>r.p),false),{"stroke-width":4.2});
  addPath(L.barrier,"barrier",dOf(barriers,false));
  addPath(L.rail,"rail",dOf(rails,false),{"stroke-width":1.6});
  const buckets={maj:[],min:[],pth:[]};
  for(const r of roads){
    if(MAJ.test(r.h)) buckets.maj.push(r);
    else if(PTH.test(r.h)) buckets.pth.push(r);
    else buckets.min.push(r);
  }
  const byWidth={};
  for(const key of ["maj","min"]){
    for(const r of buckets[key]){
      const w=roadW(r.h), k2=key+"|"+w;
      (byWidth[k2]=byWidth[k2]||[]).push(r.p);
    }
  }
  for(const [k2,list] of Object.entries(byWidth)){
    const [key,w]=k2.split("|");
    addPath(key==="maj"?L.caseMaj:L.caseMin, key==="maj"?"case-maj":"case-min", dOf(list,false), {"stroke-width":(+w)+1.8});
  }
  for(const [k2,list] of Object.entries(byWidth)){
    const [key,w]=k2.split("|");
    addPath(key==="maj"?L.roadMaj:L.roadMin, key==="maj"?"road-maj":"road-min", dOf(list,false), {"stroke-width":+w});
  }
  // Fusswege werden nicht mehr flaechig gerendert – nur Durchfahrten (Layer passage)
  const named={};
  for(const r of buckets.maj){
    if(!r.name) continue;
    let len=0;
    for(let i=1;i<r.p.length;i++) len+=Math.hypot(r.p[i][0]-r.p[i-1][0],r.p[i][1]-r.p[i-1][1]);
    if(!named[r.name]||named[r.name].len<len) named[r.name]={r,len};
  }
  let lblId=0;
  for(const {r,len} of Object.values(named)){
    if(len<60) continue;
    let pts=r.p;
    if(pts[pts.length-1][0]<pts[0][0]) pts=[...pts].reverse();
    const id="rl"+(lblId++);
    const ph=document.createElementNS(NS,"path");
    ph.setAttribute("id",id);
    ph.setAttribute("d","M"+pts.map(q2=>q2[0].toFixed(1)+" "+q2[1].toFixed(1)).join("L"));
    ph.setAttribute("fill","none");
    L.rlbl.appendChild(ph);
    const t=document.createElementNS(NS,"text");
    t.setAttribute("class","roadlbl");
    const tp=document.createElementNS(NS,"textPath");
    tp.setAttribute("href","#"+id);
    tp.setAttribute("startOffset","50%");
    tp.setAttribute("text-anchor","middle");
    tp.textContent=r.name;
    t.appendChild(tp); L.rlbl.appendChild(t);
  }
  // Auswahl: wichtige Merkmale zuerst, 70 m Mindestabstand, max. 25 Labels
  pois.sort((a,b)=>b.prio-a.prio);
  const seenPoi=new Set(), chosen=[];
  for(const p of pois){
    if(p.prio<=0||seenPoi.has(p.name)) continue;
    if(chosen.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<70)) continue;
    seenPoi.add(p.name); chosen.push(p);
    if(chosen.length>=25) break;
  }
  for(const p of chosen){
    const g=document.createElementNS(NS,"g");
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("class","poidot"); c.setAttribute("r",2.2);
    c.setAttribute("cx",p.x); c.setAttribute("cy",p.y);
    const t=document.createElementNS(NS,"text");
    t.setAttribute("class","poilbl");
    t.setAttribute("x",p.x+3.5); t.setAttribute("y",p.y+2);
    t.textContent=p.name.length>30?p.name.slice(0,28)+"…":p.name;
    g.appendChild(c); g.appendChild(t);
    L.poi.appendChild(g);
  }
  // Sichtbarer Kartenrand: Aussenbereich abdunkeln + Rahmen
  {
    const M=Math.max(Wm,Hm);
    const shade=document.createElementNS(NS,"path");
    shade.setAttribute("d",`M${-M} ${-M}H${Wm+M}V${Hm+M}H${-M}Z M0 0V${Hm}H${Wm}V0Z`);
    shade.setAttribute("fill","#6b7060"); shade.setAttribute("fill-opacity",".22");
    shade.setAttribute("fill-rule","evenodd");
    L.frame.appendChild(shade);
    const fr=document.createElementNS(NS,"rect");
    fr.setAttribute("x",0); fr.setAttribute("y",0);
    fr.setAttribute("width",Wm); fr.setAttribute("height",Hm);
    fr.setAttribute("class","framerect");
    L.frame.appendChild(fr);
    // Fog-of-War-Flaeche (weit ueber den Kartenrand hinaus)
    const fw=document.getElementById("fogw");
    fw.setAttribute("x",-M*3); fw.setAttribute("y",-M*3);
    fw.setAttribute("width",Wm+M*6); fw.setAttribute("height",Hm+M*6);
    fogRect=document.createElementNS(NS,"rect");
    fogRect.setAttribute("x",-M*3); fogRect.setAttribute("y",-M*3);
    fogRect.setAttribute("width",Wm+M*6); fogRect.setAttribute("height",Hm+M*6);
    fogRect.setAttribute("fill","#39402f"); fogRect.setAttribute("fill-opacity",".45");
    fogRect.setAttribute("mask","url(#fogmask)");
    fogRect.setAttribute("pointer-events","none");
    fogRect.style.display="none";
    L.vision.appendChild(fogRect);
  }
  buildGrid(blds,bldInner,barriers,waters,waterInner,passages,forests,roads,parkings,greens);
  generateBlocks(blds);
  // In den Cache legen (Label: laengste benannte Strasse, sonst erstes Merkmal)
  {
    let best=null;
    for(const [nm,v] of Object.entries(named)){ if(!best||v.len>best.len) best={nm,len:v.len}; }
    const label=best?best.nm:((pois[0]&&pois[0].name)||"Bereich");
    window.curArea={S,W,N,E,label,data};
    if(!cached) saveCache(S,W,N,E,data,label);
  }
  document.getElementById("saved").style.display="none";
  document.getElementById("ov").style.display="none";
  document.getElementById("dt").style.display="";
  document.getElementById("btnBox").style.display="none";
  document.getElementById("btnBack").style.display="";
  document.getElementById("btnMk").style.display="";
  document.getElementById("btnStart").style.display="";
  document.getElementById("mode").style.display="";
  document.getElementById("btnSave").style.display="";
  document.getElementById("colors").style.display="flex";
  const k=Math.min(innerWidth/Wm, innerHeight/Hm)*0.95;
  dt.minK=k*0.8; dt.maxK=90;
  dt.k=k;
  dt.tx=(innerWidth-Wm*k)/2; dt.ty=(innerHeight-Hm*k)/2;
  dt.apply();
  computeComponents();
  drawCompOverlay();
  lastKnow=0; lastKsig=""; visSig=""; knowImg=null;
  updateVision();
  const shares=grid.playable.map(id=>Math.round(grid.compSizes[id]/grid.walkable*100)+" %").join(", ");
  setStatus("Bereich geladen. Spielbare zusammenhängende Bereiche sind eingefärbt ("+shares+"), rot = abgeschnitten. Setze Soldaten (📍) in den Bereich, in dem du spielen willst – Gegner spawnen nur dort.");
}
