/* ============ Routing-Raster & A* ============ */
let grid=null;
function buildGrid(blds,bldInner,barriers,waters,waterInner,passages,forests,roads,parkings,greens){
  const cell=Math.max(0.8, Math.max(area.Wm,area.Hm)/2000);
  const GW=Math.max(8,Math.ceil(area.Wm/cell)), GH=Math.max(8,Math.ceil(area.Hm/cell));
  const flags=new Uint8Array(GW*GH);
  const bres=(pts,fn)=>{
    for(let i=0;i<pts.length-1;i++){
      let x0=Math.min(GW-1,Math.max(0,Math.floor(pts[i][0]/cell))), y0=Math.min(GH-1,Math.max(0,Math.floor(pts[i][1]/cell)));
      const x1=Math.min(GW-1,Math.max(0,Math.floor(pts[i+1][0]/cell))), y1=Math.min(GH-1,Math.max(0,Math.floor(pts[i+1][1]/cell)));
      const dx=Math.abs(x1-x0), dy=Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1;
      let err=dx-dy;
      for(;;){
        fn(x0,y0);
        if(x0===x1&&y0===y1) break;
        const e2=2*err;
        if(e2>-dy){err-=dy;x0+=sx;}
        if(e2<dx){err+=dx;y0+=sy;}
      }
    }
  };
  const fill=(pts,fn)=>{
    let mn=Infinity,mx=-Infinity;
    for(const p of pts){ if(p[1]<mn)mn=p[1]; if(p[1]>mx)mx=p[1]; }
    const cy0=Math.max(0,Math.floor(mn/cell)), cy1=Math.min(GH-1,Math.floor(mx/cell));
    for(let cy=cy0;cy<=cy1;cy++){
      const ym=(cy+0.5)*cell, xs=[];
      for(let i=0,j=pts.length-1;i<pts.length;j=i++){
        const ya=pts[i][1], yb=pts[j][1];
        if((ya>ym)!==(yb>ym)) xs.push(pts[i][0]+(ym-ya)/(yb-ya)*(pts[j][0]-pts[i][0]));
      }
      xs.sort((a,b)=>a-b);
      for(let k2=0;k2+1<xs.length;k2+=2){
        const a=Math.max(0,Math.floor(xs[k2]/cell)), b=Math.min(GW-1,Math.floor(xs[k2+1]/cell));
        for(let cx=a;cx<=b;cx++) fn(cy*GW+cx);
      }
    }
  };
  // Bits: 1 blockiert (Gebaeude) · 2 Barriere · 4 sichtblockierend (Gebaeude)
  //       8 Wasser (extrem langsam) · 16 Wald (Sicht gedaempft, langsamer) · 32 Strasse/Weg (schneller)
  const stamp=(rr,val,clearMask)=>(x,y)=>{
    for(let dy=-rr;dy<=rr;dy++) for(let dx=-rr;dx<=rr;dx++){
      if(dx*dx+dy*dy>rr*rr) continue;
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=GW||ny>=GH) continue;
      if(clearMask) flags[ny*GW+nx]&=~clearMask;
      if(val) flags[ny*GW+nx]|=val;
    }
  };
  for(const p of (greens||[])){ fill(p,i=>flags[i]|=128); }   // Wiesen/Gruen: langsamer als Wege
  for(const p of forests){ fill(p,i=>flags[i]|=16); }
  for(const p of blds){ fill(p,i=>flags[i]|=5); bres(p,(x,y)=>flags[y*GW+x]|=5); }
  for(const p of bldInner) fill(p,i=>flags[i]&=~5);           // Innenhoefe begehbar
  for(const p of waters){ fill(p,i=>flags[i]|=8); bres(p,(x,y)=>flags[y*GW+x]|=8); }
  for(const p of waterInner) fill(p,i=>flags[i]&=~8);         // Inseln
  // Strassen/Wege als schnelle Korridore stempeln; echte Fahrstrassen zusaetzlich
  // mit Bit 64 (Blockgrenze) – Zufahrten (service) und Fusswege begrenzen KEINE Bloecke
  for(const r of roads){
    const w=PTH.test(r.h)?2:roadW(r.h);
    const isStreet=!PTH.test(r.h)&&!/^service$/.test(r.h);
    bres(r.p, stamp(Math.max(1,Math.round(w/2/cell)),isStreet?96:32,0));
  }
  // Parkplaetze: versiegelte Flaeche, zaehlt wie Weg (schnell, keine Gartenflaeche, Blockgrenze)
  for(const p of (parkings||[])){ fill(p,i=>{ if(!(flags[i]&1)) flags[i]|=32; }); }
  // Durchfahrten: Korridor durch Gebaeude freischneiden (~2,5 m Radius), gelten als Weg
  const rr=Math.max(1,Math.round(2.5/cell));
  for(const r of passages) bres(r.p, stamp(rr,32,5));
  const btype=new Uint8Array(GW*GH);   // 0 unbekannt · 1 Zaun · 2 Hecke · 3 Mauer
  for(const p of barriers) bres(p,(x,y)=>{ if(!(flags[y*GW+x]&1)){ flags[y*GW+x]|=2; btype[y*GW+x]=1; } });
  grid={flags,GW,GH,cell,btype,pth:roads.filter(r=>PTH.test(r.h)).map(r=>r.p)};
}
/* Barriere-Typen: [Kletterdauer s, Hoerweite m] – Zaun schnell aber laut,
   Mauer langsam aber leise, Hecke dazwischen (0 = unbekannt/OSM-Default) */
const BARRTYP={0:[3.5,40],1:[2.5,60],2:[3.5,40],3:[5,25]};
/* Zusammenhaengende begehbare Bereiche: nur Bereiche >=10 % sind spielbar */
function computeComponents(){
  const {flags,GW,GH}=grid;
  const comp=new Int32Array(GW*GH).fill(-1);
  const sizes=[];
  const stack=new Int32Array(GW*GH);
  let walkable=0;
  for(let i=0;i<GW*GH;i++) if(!(flags[i]&1)) walkable++;
  for(let i=0;i<GW*GH;i++){
    if((flags[i]&1)||comp[i]!==-1) continue;
    const id=sizes.length;
    let sp=0, size=0;
    stack[sp++]=i; comp[i]=id;
    while(sp>0){
      const c=stack[--sp]; size++;
      const cx=c%GW, cy=(c/GW)|0;
      if(cx>0){ const n=c-1; if(!(flags[n]&1)&&comp[n]===-1){ comp[n]=id; stack[sp++]=n; } }
      if(cx<GW-1){ const n=c+1; if(!(flags[n]&1)&&comp[n]===-1){ comp[n]=id; stack[sp++]=n; } }
      if(cy>0){ const n=c-GW; if(!(flags[n]&1)&&comp[n]===-1){ comp[n]=id; stack[sp++]=n; } }
      if(cy<GH-1){ const n=c+GW; if(!(flags[n]&1)&&comp[n]===-1){ comp[n]=id; stack[sp++]=n; } }
    }
    sizes.push(size);
  }
  const playable=[];
  for(let id=0;id<sizes.length;id++) if(sizes[id]>=walkable*0.10) playable.push(id);
  playable.sort((a,b)=>sizes[b]-sizes[a]);
  grid.comp=comp; grid.compSizes=sizes; grid.walkable=walkable; grid.playable=playable;
}
/* ===== Parzellen-Pipeline v2 (nach User-Skizzen) =====
   Schritt 1: Bloecke = von Strassen (und Wasser) umschlossene Zusammenhangsflaechen.
   Schritt 2: Haeuser (35-400 m²) je Block.
   Schritt 3: "Gruene Linie" = Hintergarten-Trennlinie: Pfad von Blockende zu
   Blockende, der zwischen sich gegenueberstehenden Haeusern mittig laeuft
   (Kosten steigen nahe Gebaeuden -> rote Anker automatisch) und Luecken
   gerade interpoliert (dort sind die Kosten flach -> kuerzester Weg). */
function generateBlocks(blds){
  if(!grid) return;
  const {flags,GW,GH,cell}=grid;
  const N=GW*GH;
  L.fence.innerHTML="";
  // Haeuser
  const houses=[];
  for(const p of blds){
    if(!p||p.length<3) continue;
    let a2=0,cx=0,cy=0;
    for(let i=0,j=p.length-1;i<p.length;j=i++){
      const cr=p[j][0]*p[i][1]-p[i][0]*p[j][1];
      a2+=cr; cx+=(p[j][0]+p[i][0])*cr; cy+=(p[j][1]+p[i][1])*cr;
    }
    if(a2===0) continue;
    const A=Math.abs(a2/2);
    if(A<55||A>420) continue;                 // 55 m²: groessere Garagen zaehlen nicht als Haus
    houses.push({p,cx:cx/(3*a2),cy:cy/(3*a2)});
  }
  // Bloecke fluten (Grenze = Strasse/Wasser); Rand-beruehrende Bloecke sind "aussen"
  const blk=new Int32Array(N).fill(-1);
  const q=new Int32Array(N);
  const isBound=i=>(flags[i]&(8|64))!==0;   // nur Wasser + echte Fahrstrassen begrenzen Bloecke
  const sizes=[], edgeTouch=[];
  for(let s=0;s<N;s++){
    if(blk[s]>=0||isBound(s)) continue;
    const id=sizes.length;
    let qh=0,qt=0,cnt=0,edge=false;
    q[qt++]=s; blk[s]=id;
    while(qh<qt){
      const i=q[qh++]; cnt++;
      const x=i%GW,y=(i/GW)|0;
      if(x===0||y===0||x===GW-1||y===GH-1) edge=true;
      if(x>0){const nn=i-1; if(blk[nn]<0&&!isBound(nn)){blk[nn]=id;q[qt++]=nn;}}
      if(x<GW-1){const nn=i+1; if(blk[nn]<0&&!isBound(nn)){blk[nn]=id;q[qt++]=nn;}}
      if(y>0){const nn=i-GW; if(blk[nn]<0&&!isBound(nn)){blk[nn]=id;q[qt++]=nn;}}
      if(y<GH-1){const nn=i+GW; if(blk[nn]<0&&!isBound(nn)){blk[nn]=id;q[qt++]=nn;}}
    }
    sizes.push(cnt); edgeTouch.push(edge);
  }
  // Haus -> Block
  const byBlk=new Map();
  for(const h of houses){
    const i=Math.min(GH-1,Math.max(0,(h.cy/cell)|0))*GW+Math.min(GW-1,Math.max(0,(h.cx/cell)|0));
    const id=blk[i];
    if(id<0) continue;
    h.blk=id;
    let a=byBlk.get(id); if(!a){a=[];byBlk.set(id,a);}
    a.push(h);
  }
  const CHECK=true;   // Kontroll-Ansicht: X + Blockumrandung + Mittellinien-Anker
  // Schema "Wohnblock": >=4 Haeuser, geschlossen, nicht riesig, dicht genug bebaut
  const qualM=new Uint8Array(sizes.length);
  for(const [id,hs] of byBlk){
    const areaM2=sizes[id]*cell*cell;
    if(hs.length>=4&&!edgeTouch[id]&&areaM2<=150000&&areaM2/hs.length<=6000) qualM[id]=1;
  }
  // Abstand zur naechsten Gebaeudezelle (in Zellen), blockintern (Strassen stoppen)
  const dB=new Int32Array(N).fill(-1);
  {
    let qt=0;
    for(let i=0;i<N;i++) if((flags[i]&1)&&!isBound(i)){ dB[i]=0; q[qt++]=i; }
    let qh=0;
    while(qh<qt){
      const i=q[qh++], d=dB[i], x=i%GW, y=(i/GW)|0;
      if(x>0){const nn=i-1; if(dB[nn]<0&&!isBound(nn)){dB[nn]=d+1;q[qt++]=nn;}}
      if(x<GW-1){const nn=i+1; if(dB[nn]<0&&!isBound(nn)){dB[nn]=d+1;q[qt++]=nn;}}
      if(y>0){const nn=i-GW; if(dB[nn]<0&&!isBound(nn)){dB[nn]=d+1;q[qt++]=nn;}}
      if(y<GH-1){const nn=i-0+GW; if(dB[nn]<0&&!isBound(nn)){dB[nn]=d+1;q[qt++]=nn;}}
    }
  }
  // Abstand zur Blockgrenze (Strasse/Wasser) – die Linie soll auch von Strassen wegbleiben
  const dR=new Int32Array(N).fill(-1);
  {
    let qt=0;
    for(let i=0;i<N;i++){
      if(isBound(i)||blk[i]<0) continue;
      const x=i%GW,y=(i/GW)|0;
      const nearB=(x>0&&isBound(i-1))||(x<GW-1&&isBound(i+1))||(y>0&&isBound(i-GW))||(y<GH-1&&isBound(i+GW))||x===0||y===0||x===GW-1||y===GH-1;
      if(nearB){ dR[i]=0; q[qt++]=i; }
    }
    let qh=0;
    while(qh<qt){
      const i=q[qh++], d=dR[i], x=i%GW, y=(i/GW)|0;
      if(x>0){const nn=i-1; if(dR[nn]<0&&!isBound(nn)&&blk[nn]>=0){dR[nn]=d+1;q[qt++]=nn;}}
      if(x<GW-1){const nn=i+1; if(dR[nn]<0&&!isBound(nn)&&blk[nn]>=0){dR[nn]=d+1;q[qt++]=nn;}}
      if(y>0){const nn=i-GW; if(dR[nn]<0&&!isBound(nn)&&blk[nn]>=0){dR[nn]=d+1;q[qt++]=nn;}}
      if(y<GH-1){const nn=i+GW; if(dR[nn]<0&&!isBound(nn)&&blk[nn]>=0){dR[nn]=d+1;q[qt++]=nn;}}
    }
  }
  const tmpD=new Int32Array(N);
  const walkable=i=>blk[i]>=0&&!(flags[i]&1);
  // geodätisch entferntester Punkt (BFS innerhalb des Blocks, Gebaeude blockieren)
  function far(start,id){
    tmpD.fill(-1);
    let qh=0,qt=0,last=start;
    tmpD[start]=0; q[qt++]=start;
    while(qh<qt){
      const i=q[qh++]; last=i;
      const x=i%GW,y=(i/GW)|0;
      const step=nn=>{ if(tmpD[nn]<0&&blk[nn]===id&&!(flags[nn]&1)){tmpD[nn]=tmpD[i]+1;q[qt++]=nn;} };
      if(x>0)step(i-1); if(x<GW-1)step(i+1); if(y>0)step(i-GW); if(y<GH-1)step(i+GW);
    }
    return last;
  }
  window.blockLines=[];   // fuer die naechsten Schritte aufgehoben
  for(const [id,hs] of byBlk){
    if(!qualM[id]) continue;
    // Startpunkt: offenste Stelle des Blocks (max. Gebaeudeabstand)
    let m=-1,bd=-1;
    for(let i=0;i<N;i++) if(blk[i]===id&&!(flags[i]&1)&&dB[i]>bd){ bd=dB[i]; m=i; }
    if(m<0) continue;
    const e1=far(m,id), e2=far(e1,id);
    // Dijkstra e1 -> e2: Kosten hoch nahe Gebaeuden -> Pfad laeuft mittig zwischen den Reihen
    if(!fpG||fpG.length!==N){ fpG=new Float64Array(N); fpCame=new Int32Array(N); fpVer=new Int32Array(N); fpClosedV=new Int32Array(N); fpVerN=0; }
    const ver=++fpVerN;
    const heap=[];
    const push=(f,i)=>{ heap.push([f,i]); let c=heap.length-1; while(c>0){const pp=(c-1)>>1; if(heap[pp][0]<=heap[c][0])break; const t=heap[pp];heap[pp]=heap[c];heap[c]=t; c=pp;} };
    const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let c=0; for(;;){ let l=2*c+1,r2=l+1,mm=c; if(l<heap.length&&heap[l][0]<heap[mm][0])mm=l; if(r2<heap.length&&heap[r2][0]<heap[mm][0])mm=r2; if(mm===c)break; const t=heap[mm];heap[mm]=heap[c];heap[c]=t; c=mm; } } return top; };
    fpVer[e1]=ver; fpG[e1]=0; fpCame[e1]=-1; push(0,e1);
    let found=false;
    while(heap.length){
      const [,i]=pop();
      if(fpClosedV[i]===ver) continue;
      fpClosedV[i]=ver;
      if(i===e2){found=true;break;}
      const x=i%GW,y=(i/GW)|0, gi=fpG[i];
      const step=nn=>{
        if(blk[nn]!==id||(flags[nn]&1)) return;
        const dm=dB[nn]*cell, rm=Math.max(0,dR[nn])*cell;
        // teuer nahe Gebaeuden UND nahe Strassen -> Linie bleibt mittig
        const ng=gi+cell*(1+60/(1+dm)+60/(1+rm));
        const old=fpVer[nn]===ver?fpG[nn]:Infinity;
        if(ng<old-1e-9){ fpVer[nn]=ver; fpG[nn]=ng; fpCame[nn]=i; push(ng,nn); }
      };
      if(x>0)step(i-1); if(x<GW-1)step(i+1); if(y>0)step(i-GW); if(y<GH-1)step(i+GW);
    }
    if(!found) continue;
    const pts=[];
    for(let i=e2;i!==-1;i=fpCame[i]) pts.push([((i%GW)+0.5)*cell,(((i/GW)|0)+0.5)*cell]);
    pts.reverse();
    window.blockLines.push({blk:id,pts,houses:hs});
    if(!CHECK){
      // Anzeige: gruene gestrichelte Trennlinie
      let d="";
      for(let k=0;k<pts.length;k+=3) d+=(d?"L":"M")+pts[k][0].toFixed(1)+" "+pts[k][1].toFixed(1);
      const el=document.createElementNS(NS,"path");
      el.setAttribute("d",d);
      el.setAttribute("fill","none");
      el.setAttribute("stroke","#2f8f2f");
      el.setAttribute("stroke-width","1.4");
      el.setAttribute("stroke-dasharray","6 4");
      el.setAttribute("opacity",".95");
      L.fence.appendChild(el);
    }
  }
  if(CHECK){
    /* ===== PRODUKTIV: Analyse liefert Grenz-Polylinien (orange Fluchten samt
       Interpolation, gelbe Mittellinien, blaue Quergrenzen). Diese werden unten
       zu 80 % mit Zaun/Hecke/Mauer bebaut. Fusswege werden normale Wege. ===== */
    const boundaryRuns=[];   // {g:Grenz-ID, pts:[[x,y],...]} in Zellschritten
    let gid=0;
    let dPath="";            // Fussweg-Darstellung (kein Hindernis)
    /* Gruene Kanten (User-Verfahren): alle Polygonkanten unmarkierter Gebaeude in
       qualifizierten Bloecken, die +-30 Grad parallel zum lokalen Strassenverlauf
       liegen (lokale Richtung = Tangente der Blockmittellinie). */
    const lineByBlk=new Map(window.blockLines.map(o=>[o.blk,o]));
    let dGrn="";
    window.edgeHints=[];
    let bidC=0;
    for(const p of blds){
      if(!p||p.length<3) continue;
      let a2=0,scx=0,scy=0;
      for(let i=0,j=p.length-1;i<p.length;j=i++){
        const cr=p[j][0]*p[i][1]-p[i][0]*p[j][1];
        a2+=cr; scx+=(p[j][0]+p[i][0])*cr; scy+=(p[j][1]+p[i][1])*cr;
      }
      if(a2===0) continue;
      const A=Math.abs(a2/2);
      if(A<6||A>=55) continue;                   // nur unmarkierte Nebengebaeude
      scx/=3*a2; scy/=3*a2;
      const ci=Math.min(GH-1,Math.max(0,(scy/cell)|0))*GW+Math.min(GW-1,Math.max(0,(scx/cell)|0));
      const id=blk[ci];
      if(id<0||!qualM[id]) continue;
      const bl=lineByBlk.get(id);
      if(!bl) continue;
      // lokale Strassenrichtung: Tangente der Mittellinie am naechsten Punkt
      let bi=0,bd2=1e18;
      for(let k=0;k<bl.pts.length;k+=2){
        const ddx=bl.pts[k][0]-scx, ddy=bl.pts[k][1]-scy, d2=ddx*ddx+ddy*ddy;
        if(d2<bd2){ bd2=d2; bi=k; }
      }
      const k1=Math.max(0,bi-6), k2=Math.min(bl.pts.length-1,bi+6);
      let tx=bl.pts[k2][0]-bl.pts[k1][0], ty=bl.pts[k2][1]-bl.pts[k1][1];
      const tl=Math.hypot(tx,ty)||1; tx/=tl; ty/=tl;
      const bid=bidC++;
      for(let i=0;i<p.length-1;i++){
        const ex=p[i+1][0]-p[i][0], ey=p[i+1][1]-p[i][1];
        const el2=Math.hypot(ex,ey);
        if(el2<2) continue;                      // Mini-Kanten ignorieren
        const dot=Math.abs((ex*tx+ey*ty)/el2);
        if(dot<0.866) continue;                  // nicht +-30 Grad strassenparallel
        window.edgeHints.push({x1:p[i][0],y1:p[i][1],x2:p[i+1][0],y2:p[i+1][1],blk:id,bid});
        dGrn+="M"+p[i][0].toFixed(1)+" "+p[i][1].toFixed(1)+"L"+p[i+1][0].toFixed(1)+" "+p[i+1][1].toFixed(1);
      }
    }
    /* Priorisierung (User-Verfahren): Kanten MEHRERER Gebaeude, die auf ein und
       derselben Linie liegen, stuetzen diese Linie. Strassen hier als ~gerade
       angenommen: Projektion auf die Block-Hauptachse, 1D-Clustern der Offsets;
       Cluster mit >=3 verschiedenen Gebaeuden -> durchgezogene HELLGRUENE Linie. */
    const edgesByBlk=new Map();
    for(const h of window.edgeHints){
      let a=edgesByBlk.get(h.blk); if(!a){a=[];edgesByBlk.set(h.blk,a);}
      a.push(h);
    }
    let dLight="";
    window.mainLines=[];
    const orangeBlocks=new Set();
    // Langlinien (orange Fluchten, Fusswege, gelbe Mittellinien) fuer die Quergrenzen sammeln
    const longByBlk=new Map();
    const addLong=(bid2,pts)=>{
      if(!pts||pts.length<3) return;
      let a=longByBlk.get(bid2); if(!a){a=[];longByBlk.set(bid2,a);}
      a.push(pts);
    };
    /* Greedy-Kettenwachstum: Linie startet an der laengsten freien Kante und darf
       nur Kanten anketten, die (a) <=15 Grad zur Linie stehen, (b) mit beiden
       Endpunkten <=1.8 m an ihr liegen und (c) hoechstens 35 m Luecke zur bisherigen
       Stuetzung haben. Verhindert Zufalls-Kollinearitaet quer durch grosse Bloecke. */
    for(const [id,edges] of edgesByBlk){
      if(edges.length<3) continue;
      const oranges=[];
      const E=edges.map(e=>({x1:e.x1,y1:e.y1,x2:e.x2,y2:e.y2,bid:e.bid,
        len:Math.hypot(e.x2-e.x1,e.y2-e.y1),used:false})).sort((a,b)=>b.len-a.len);
      /* Kandidatenlinien sind IMMER die Verlaengerungen echter Kanten (Anfangs- und
         Endpunkt einer dunkelgruenen Kante definieren die Linie -> exakt parallel).
         Gewaehlt wird je Runde die Kantenlinie, die die meisten Gebaeude trifft. */
      const evalSeed=seed=>{
        const fx=(seed.x2-seed.x1)/seed.len, fy=(seed.y2-seed.y1)/seed.len;
        const px=seed.x1, py=seed.y1;
        const distLn=(x,y)=>Math.abs(-(x-px)*fy+(y-py)*fx);
        const proj=(x,y)=>(x-px)*fx+(y-py)*fy;
        const cand=[];
        for(const c of E){
          if(c.used) continue;
          const cd=Math.abs(((c.x2-c.x1)*fx+(c.y2-c.y1)*fy)/c.len);
          if(cd<0.985) continue;                              // <=10 Grad: wirklich parallel
          // streng: max 0,75 m Versatz – staerker abweichende Kanten sind KEINE gemeinsame Grenze
          if(distLn(c.x1,c.y1)>0.75||distLn(c.x2,c.y2)>0.75) continue;
          cand.push({e:c,lo:Math.min(proj(c.x1,c.y1),proj(c.x2,c.y2)),hi:Math.max(proj(c.x1,c.y1),proj(c.x2,c.y2))});
        }
        cand.sort((a,b)=>a.lo-b.lo);
        // zusammenhaengende Kette um den Seed (Luecken <=35 m)
        const si=cand.findIndex(c=>c.e===seed);
        if(si<0) return null;
        const chain=[cand[si]];
        for(let i=si-1;i>=0;i--){ if(chain[0].lo-cand[i].hi<=35) chain.unshift(cand[i]); else break; }
        for(let i=si+1;i<cand.length;i++){ if(cand[i].lo-chain[chain.length-1].hi<=35) chain.push(cand[i]); else break; }
        return {seed,fx,fy,px,py,chain,bids:new Set(chain.map(c=>c.e.bid))};
      };
      for(;;){
        let best=null;
        for(const seed of E){
          if(seed.used) continue;
          const r=evalSeed(seed);
          if(!r||r.bids.size<3) continue;
          const lenSum=r.chain.reduce((s,c)=>s+c.e.len,0);
          if(!best||r.bids.size>best.bids.size||(r.bids.size===best.bids.size&&lenSum>best.lenSum))
            best={...r,lenSum};
        }
        if(!best) break;
        for(const c of best.chain) c.e.used=true;
        const t0=best.chain[0].lo, t1=best.chain[best.chain.length-1].hi;
        const {px,py,fx,fy}=best;
        /* Kontext-Pruefung (User-Regel): eine echte Grundstuecksgrenze hat auf BEIDEN
           Seiten quer zur Linie sowohl eine Strasse als auch Haeuser, und die
           Plus/Minus-Abstaende eines Paares weichen nicht um Faktor 10 ab. */
        const nx2=-fy, ny2=fx;
        const rayD=(sx,sy,dx2,dy2)=>{
          for(let d=cell;d<=150;d+=cell){
            const gx2=((sx+dx2*d)/cell)|0, gy2=((sy+dy2*d)/cell)|0;
            if(gx2<0||gy2<0||gx2>=GW||gy2>=GH) return -1;
            if(isBound(gy2*GW+gx2)) return d;
          }
          return -1;
        };
        let sPlus=1e9,sMinus=1e9;
        for(const fr of [0.25,0.5,0.75]){
          const sx=px+fx*(t0+(t1-t0)*fr), sy=py+fy*(t0+(t1-t0)*fr);
          const a=rayD(sx,sy,nx2,ny2), b=rayD(sx,sy,-nx2,-ny2);
          if(a>0) sPlus=Math.min(sPlus,a);
          if(b>0) sMinus=Math.min(sMinus,b);
        }
        let ok=sPlus<1e9&&sMinus<1e9&&Math.max(sPlus,sMinus)<=10*Math.min(sPlus,sMinus);
        if(ok){
          let hPlus=1e9,hMinus=1e9;
          for(const h of (byBlk.get(id)||[])){
            const tt=(h.cx-px)*fx+(h.cy-py)*fy;
            if(tt<t0-10||tt>t1+10) continue;                 // nur angrenzende Haeuser
            const off=(h.cx-px)*nx2+(h.cy-py)*ny2;
            if(off>0.5) hPlus=Math.min(hPlus,off);
            else if(off<-0.5) hMinus=Math.min(hMinus,-off);
          }
          ok=hPlus<60&&hMinus<60&&Math.max(hPlus,hMinus)<=10*Math.min(hPlus,hMinus);
        }
        window.mainLines.push({blk:id,ax:px+fx*t0,ay:py+fy*t0,bx:px+fx*t1,by:py+fy*t1,support:best.bids.size,valid:ok});
        if(!ok) continue;                                    // falsche Kandidaten ausblenden
        oranges.push({px,py,fx,fy,t0,t1,support:best.bids.size,lenSum:best.lenSum});
      }
      /* Querungs-Check: Linie darf nicht DURCH ein HAUS (X-Gebaeude) laufen –
         entlang von Garagenwaenden ist ausdruecklich ok (das sind die Stuetzen).
         Polygon-genauer Test gegen die erkannten Haeuser des Blocks. */
      const cellAt=(x,y)=>{
        const gx=(x/cell)|0, gy=(y/cell)|0;
        if(gx<0||gy<0||gx>=GW||gy>=GH) return -1;
        return gy*GW+gx;
      };
      const houseList=(byBlk.get(id)||[]).map(h=>{
        let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
        for(const q2 of h.p){ if(q2[0]<x0)x0=q2[0]; if(q2[0]>x1)x1=q2[0]; if(q2[1]<y0)y0=q2[1]; if(q2[1]>y1)y1=q2[1]; }
        return {p:h.p,x0,y0,x1,y1};
      });
      const inHouse=(x,y)=>{
        for(const hl of houseList){
          if(x<hl.x0||x>hl.x1||y<hl.y0||y>hl.y1) continue;
          let inside=false;
          const p=hl.p;
          for(let i2=0,j2=p.length-1;i2<p.length;j2=i2++){
            if((p[i2][1]>y)!==(p[j2][1]>y)&&x<p[i2][0]+(y-p[i2][1])/(p[j2][1]-p[i2][1])*(p[j2][0]-p[i2][0])) inside=!inside;
          }
          if(inside) return true;
        }
        return false;
      };
      const crossesHouse=(px,py,fx,fy,t0,t1)=>{
        let run=0;
        for(let t=t0;t<=t1;t+=cell){
          if(inHouse(px+fx*t,py+fy*t)){ run+=cell; if(run>2) return true; }
          else run=0;
        }
        return false;
      };
      const pathOK=(x1,y1,x2,y2)=>{           // Verbinder: im Block, keine Strasse, kein Haus
        const L2=Math.hypot(x2-x1,y2-y1);
        if(L2<0.5) return true;
        const ux=(x2-x1)/L2, uy=(y2-y1)/L2;
        let run=0;
        for(let t=0;t<=L2;t+=cell){
          const x=x1+ux*t, y=y1+uy*t;
          const i=cellAt(x,y);
          if(i<0||(blk[i]!==id&&!(flags[i]&1))) return false;
          if(isBound(i)) return false;
          if(inHouse(x,y)){ run+=cell; if(run>2) return false; }
          else run=0;
        }
        return true;
      };
      // 1. Haus-Querer raus, 2. Parallel-Duplikate: staerkste Kollinearitaet gewinnt
      const clean=oranges.filter(o=>!crossesHouse(o.px,o.py,o.fx,o.fy,o.t0,o.t1))
        .sort((a,b)=>b.support-a.support||b.lenSum-a.lenSum);
      const kept=[];
      for(const o of clean){
        let dup=false;
        for(const k of kept){
          if(Math.abs(o.fx*k.fx+o.fy*k.fy)<0.966) continue;
          const mx2=o.px+o.fx*(o.t0+o.t1)/2, my2=o.py+o.fy*(o.t0+o.t1)/2;
          if(Math.abs(-(mx2-k.px)*k.fy+(my2-k.py)*k.fx)>12) continue;   // "gleiche Hoehe": bis 12 m Versatz
          const pj=(x,y)=>(x-k.px)*k.fx+(y-k.py)*k.fy;
          const oa=Math.min(pj(o.px+o.fx*o.t0,o.py+o.fy*o.t0),pj(o.px+o.fx*o.t1,o.py+o.fy*o.t1));
          const ob=Math.max(pj(o.px+o.fx*o.t0,o.py+o.fy*o.t0),pj(o.px+o.fx*o.t1,o.py+o.fy*o.t1));
          if(Math.min(ob,k.t1)-Math.max(oa,k.t0)>1){ dup=true; break; }
        }
        if(!dup) kept.push(o);
      }
      // Zeichnen: IMMER geclippt auf Blockzellen UND gegen Haus-Polygone –
      // egal woher ein Segment stammt, im Haus wird nie gezeichnet
      const drawSeg=(x1,y1,x2,y2,g)=>{
        const L2=Math.hypot(x2-x1,y2-y1);
        if(L2<0.3) return;
        const ux=(x2-x1)/L2, uy=(y2-y1)/L2;
        let cur=null;
        for(let t=0;t<=L2;t+=cell){
          const x=x1+ux*t, y=y1+uy*t;
          const i=cellAt(x,y);
          const inside=i>=0&&blk[i]===id&&!inHouse(x,y);
          if(inside){ if(!cur) cur=[]; cur.push([x,y]); }
          else { if(cur&&cur.length>2) boundaryRuns.push({g,pts:cur}); cur=null; }
        }
        if(cur&&cur.length>2) boundaryRuns.push({g,pts:cur});
      };
      for(const o of kept){
        const [ax,ay]=[o.px+o.fx*o.t0,o.py+o.fy*o.t0];
        const [bx,by]=[o.px+o.fx*o.t1,o.py+o.fy*o.t1];
        drawSeg(ax,ay,bx,by,++gid);
        const lp=[];
        for(let t=o.t0;t<=o.t1;t+=2) lp.push([o.px+o.fx*t,o.py+o.fy*t]);
        addLong(id,lp);
      }
      // 3. Interpolation: fluchtende orange Linien mit einfachen geraden Verbindern
      //    koppeln; welche Enden verbunden wurden, wird vermerkt
      const endPt=(o,s)=>[o.px+o.fx*(s?o.t1:o.t0), o.py+o.fy*(s?o.t1:o.t0)];
      for(let i=0;i<kept.length;i++) for(let j=i+1;j<kept.length;j++){
        const a=kept[i], b=kept[j];
        if(Math.abs(a.fx*b.fx+a.fy*b.fy)<0.966) continue;
        let bd=1e18,sA=0,sB=0;
        for(const s1 of [0,1]) for(const s2 of [0,1]){
          const e1=endPt(a,s1), e2=endPt(b,s2);
          const d=Math.hypot(e1[0]-e2[0],e1[1]-e2[1]);
          if(d<bd){ bd=d; sA=s1; sB=s2; }
        }
        if(bd>60) continue;
        const pA=endPt(a,sA), pB=endPt(b,sB);
        const lat=Math.abs(-(pB[0]-a.px)*a.fy+(pB[1]-a.py)*a.fx);
        if(lat>8) continue;
        if(!pathOK(pA[0],pA[1],pB[0],pB[1])) continue;
        drawSeg(pA[0],pA[1],pB[0],pB[1],++gid);
        if(sA) a.conn1=true; else a.conn0=true;
        if(sB) b.conn1=true; else b.conn0=true;
      }
      // 4. Unverbundene Enden geradeaus bis zur Strasse verlaengern (Grenze wird
      //    durchgehend von Strasse zu Strasse) – nur wenn der Weg gueltig bleibt
      for(const o of kept){
        for(const s of [0,1]){
          if(s?o.conn1:o.conn0) continue;
          const [sx,sy]=endPt(o,s);
          const dirx=o.fx*(s?1:-1), diry=o.fy*(s?1:-1);
          let hit=-1;
          for(let t=cell;t<=60;t+=cell){
            const i=cellAt(sx+dirx*t,sy+diry*t);
            if(i<0){ break; }
            if(isBound(i)){ hit=t-cell; break; }
            if(blk[i]!==id&&!(flags[i]&1)) break;
          }
          if(hit<2) continue;
          const tx2=sx+dirx*hit, ty2=sy+diry*hit;
          if(!pathOK(sx,sy,tx2,ty2)) continue;
          drawSeg(sx,sy,tx2,ty2,++gid);
        }
      }
      if(kept.length) orangeBlocks.add(id);
    }
    /* Fusswege DURCH Wohnbloecke sind bestaetigte Grundstuecksgrenzen (OSM-Referenz);
       neben Strassen bleiben sie unsichtbar. ABER: Bloecke mit VIEL Fussweg
       (Friedhof/Park-Wegenetz) komplett auslassen - dort sind Wege keine Grenzen. */
    if(grid.pth){
      // LOKALE Fussweg-Dichte (12-m-Raster, 5x5-Umkreis ~ +-30 m): Wegenetz-Knaeuel
      // (Friedhof/Park) werden nur DORT uebersprungen; einzelne Wege - auch mehrere
      // im selben Block - bleiben als Grenze erhalten
      const CS=12;
      const DW=Math.max(1,Math.ceil(GW*cell/CS)), DH=Math.max(1,Math.ceil(GH*cell/CS));
      const dens=new Float32Array(DW*DH);
      for(const pp of grid.pth){
        for(let s2=0;s2<pp.length-1;s2++){
          const L2=Math.hypot(pp[s2+1][0]-pp[s2][0],pp[s2+1][1]-pp[s2][1]);
          if(L2<0.5) continue;
          const ux=(pp[s2+1][0]-pp[s2][0])/L2, uy=(pp[s2+1][1]-pp[s2][1])/L2;
          for(let t=0;t<=L2;t+=cell*2){
            const cx=((pp[s2][0]+ux*t)/CS)|0, cy=((pp[s2][1]+uy*t)/CS)|0;
            if(cx>=0&&cy>=0&&cx<DW&&cy<DH) dens[cy*DW+cx]+=cell*2;
          }
        }
      }
      const localDens=(x,y)=>{
        const cx=(x/CS)|0, cy=(y/CS)|0;
        let s=0;
        for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
          const nx=cx+dx, ny=cy+dy;
          if(nx<0||ny<0||nx>=DW||ny>=DH) continue;
          s+=dens[ny*DW+nx];
        }
        return s;
      };
      const blkAt=(x,y)=>{
        const gx=(x/cell)|0, gy=(y/cell)|0;
        if(gx<0||gy<0||gx>=GW||gy>=GH) return -1;
        return blk[gy*GW+gx];
      };
      for(const pp of grid.pth){
        for(let s2=0;s2<pp.length-1;s2++){
          const L2=Math.hypot(pp[s2+1][0]-pp[s2][0],pp[s2+1][1]-pp[s2][1]);
          if(L2<0.5) continue;
          const ux=(pp[s2+1][0]-pp[s2][0])/L2, uy=(pp[s2+1][1]-pp[s2][1])/L2;
          // Fusswege sind KEINE Grenzen (Userentscheid): sichtbarer normaler Weg,
          // bleiben aber Referenz-Langlinien fuer die Quergrenzen
          let run=false, curRun=null, curBlk=-1;
          for(let t=0;t<=L2;t+=cell){
            const x=pp[s2][0]+ux*t, y=pp[s2][1]+uy*t;
            const b=blkAt(x,y);
            const ok2=b>=0&&qualM[b]&&localDens(x,y)<=150;
            if(ok2&&!run){ dPath+="M"+x.toFixed(1)+" "+y.toFixed(1); run=true; curRun=[[x,y]]; curBlk=b; curRun.isPath=true; }
            else if(ok2){ dPath+="L"+x.toFixed(1)+" "+y.toFixed(1); curRun.push([x,y]); }
            else { if(curRun&&curRun.length>5) addLong(curBlk,curRun); curRun=null; run=false; }
          }
          if(curRun&&curRun.length>5) addLong(curBlk,curRun);
        }
      }
    }
    /* GELB: Bloecke ohne orange Flucht bekommen die Mittellinie zwischen den
       Haeuserreihen (Backbone: laeuft von Strasse zu Strasse, meidet Gebaeude) */
    let dYel="";
    for(const [id,hs] of byBlk){
      if(!qualM[id]||orangeBlocks.has(id)) continue;
      const bl=lineByBlk.get(id);
      if(!bl) continue;
      // von der MITTE nach aussen nur bis zum ersten Strassen-Kontakt zeichnen –
      // die Backbone-Enden schnoerkeln sonst um Haeuser herum zur Blockspitze
      const pts=bl.pts;
      const nearRoad=k=>{
        const gx=(pts[k][0]/cell)|0, gy=(pts[k][1]/cell)|0;
        if(gx<0||gy<0||gx>=GW||gy>=GH) return true;
        const i=gy*GW+gx;
        return dR[i]>=0&&dR[i]*cell<=4;
      };
      const mid=(pts.length/2)|0;
      let a=0,b=pts.length-1;
      for(let k=mid;k>=0;k--) if(nearRoad(k)){ a=k; break; }
      for(let k=mid;k<pts.length;k++) if(nearRoad(k)){ b=k; break; }
      if(b-a<10){ a=0; b=pts.length-1; }        // degeneriert -> ganze Linie
      const lp=[];
      for(let k=a;k<=b;k+=3) lp.push(pts[k]);
      addLong(id,lp);
      boundaryRuns.push({g:++gid,pts:lp});      // gelbe Mittellinie = echte Grenze
    }
    /* ===== QUERGRENZEN (blau, User-Verfahren) =====
       Haus braucht: sichere Strassenseite (naechste Strasse <=35 m) + Langlinie
       (orange/gelb/Fussweg) auf der RUECKSEITE (<=250 m). Nachbarpaare entlang der
       Linie: eine gemeinsame Grenze mittig - oder an der Kante eines Kleingebaeudes
       dazwischen - oder beidseits eines Fusswegs dazwischen. */
    const blueHouses=new Set();
    let dBlue="";
    window.crossLines=[];
    {
      const smalls=[];
      for(const p of blds){
        if(!p||p.length<3) continue;
        let a2=0,scx=0,scy=0;
        for(let i=0,j=p.length-1;i<p.length;j=i++){
          const cr=p[j][0]*p[i][1]-p[i][0]*p[j][1];
          a2+=cr; scx+=(p[j][0]+p[i][0])*cr; scy+=(p[j][1]+p[i][1])*cr;
        }
        if(a2===0) continue;
        const A=Math.abs(a2/2);
        if(A<6||A>=55) continue;
        smalls.push({p,cx:scx/(3*a2),cy:scy/(3*a2)});
      }
      const frontOf=(x,y)=>{
        let bd=1e18,fx2=0,fy2=0;
        for(let a2=0;a2<16;a2++){
          const ang=a2/16*2*Math.PI, dx2=Math.cos(ang), dy2=Math.sin(ang);
          for(let t2=cell;t2<=35;t2+=cell){
            const gx=((x+dx2*t2)/cell)|0, gy=((y+dy2*t2)/cell)|0;
            if(gx<0||gy<0||gx>=GW||gy>=GH) break;
            if(isBound(gy*GW+gx)){ if(t2<bd){ bd=t2; fx2=dx2; fy2=dy2; } break; }
          }
        }
        return bd<=35?{d:bd,fx:fx2,fy:fy2}:null;
      };
      for(const [id,lines] of longByBlk){
        if(!qualM[id]) continue;
        const hs=byBlk.get(id)||[];
        if(hs.length<2) continue;
        const hl=hs.map(h=>{
          let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;
          for(const q2 of h.p){ if(q2[0]<x0)x0=q2[0]; if(q2[0]>x1)x1=q2[0]; if(q2[1]<y0)y0=q2[1]; if(q2[1]>y1)y1=q2[1]; }
          return {p:h.p,x0,y0,x1,y1};
        });
        const inH=(x,y)=>{
          for(const e of hl){
            if(x<e.x0||x>e.x1||y<e.y0||y>e.y1) continue;
            let inside=false;
            const p=e.p;
            for(let i2=0,j2=p.length-1;i2<p.length;j2=i2++){
              if((p[i2][1]>y)!==(p[j2][1]>y)&&x<p[i2][0]+(y-p[i2][1])/(p[j2][1]-p[i2][1])*(p[j2][0]-p[i2][0])) inside=!inside;
            }
            if(inside) return true;
          }
          return false;
        };
        // je Hauspaar nur EINE Grenze - auch wenn mehrere Langlinien es erfassen
        const donePairs=new Set();
        const pairKey=(h1,h2)=>{
          const i1=hs.indexOf(h1), i2=hs.indexOf(h2);
          return Math.min(i1,i2)+"_"+Math.max(i1,i2);
        };
        const axesOf=h=>{
          let best=0, th=0;
          for(let i3=0;i3<h.p.length-1;i3++){
            const ddx=h.p[i3+1][0]-h.p[i3][0], ddy=h.p[i3+1][1]-h.p[i3][1], L4=ddx*ddx+ddy*ddy;
            if(L4>best){ best=L4; th=Math.atan2(ddy,ddx); }
          }
          const c3=Math.cos(th), s3=Math.sin(th);
          return [[c3,s3],[-s3,c3]];
        };
        /* Jedes Haus wird genau EINER Langlinie zugeordnet (der naechsten, die fuer
           qualifizierte Haeuser HINTER dem Haus liegt) - vorher wurde jedes Haus von
           jeder Linie im 250-m-Umkreis erfasst und jede baute eigene Grenzen (Chaos) */
        const hInfo=new Map();
        for(const h of hs){
          const f=frontOf(h.cx,h.cy);
          let best=null;
          for(let li=0;li<lines.length;li++){
            const line=lines[li];
            let bd=1e18,bk=0;
            for(let k=0;k<line.length;k++){
              const d=(line[k][0]-h.cx)*(line[k][0]-h.cx)+(line[k][1]-h.cy)*(line[k][1]-h.cy);
              if(d<bd){ bd=d; bk=k; }
            }
            bd=Math.sqrt(bd);
            if(bd>250) continue;
            let behind=false;
            if(f){
              const ldx=line[bk][0]-h.cx, ldy=line[bk][1]-h.cy;
              behind=(ldx*f.fx+ldy*f.fy<=0);
            }
            // Linien HINTER dem Haus werden bevorzugt; sonst naechstgelegene
            const score=bd+(f&&!behind?1000:0);
            if(!best||score<best.score) best={score,li,k:bk,d:bd,behind};
          }
          if(!best) continue;
          let q=false, ax=null;
          if(f&&best.behind){
            q=true;
            const cand2=axesOf(h);
            ax=Math.abs(cand2[0][0]*f.fx+cand2[0][1]*f.fy)>=Math.abs(cand2[1][0]*f.fx+cand2[1][1]*f.fy)?cand2[0]:cand2[1];
            if(ax[0]*f.fx+ax[1]*f.fy<0) ax=[-ax[0],-ax[1]];
          }
          hInfo.set(h,{li:best.li,k:best.k,f,q,ax});
        }
        for(let li=0;li<lines.length;li++){
          const line=lines[li];
          const S=[0];
          for(let k=1;k<line.length;k++) S.push(S[k-1]+Math.hypot(line[k][0]-line[k-1][0],line[k][1]-line[k-1][1]));
          const near=(x,y)=>{
            let bi=0,bd=1e18;
            for(let k=0;k<line.length;k++){
              const d=(line[k][0]-x)*(line[k][0]-x)+(line[k][1]-y)*(line[k][1]-y);
              if(d<bd){ bd=d; bi=k; }
            }
            return {k:bi,d:Math.sqrt(bd)};
          };
          const tangAt=k=>{
            const k1=Math.max(0,k-2), k2=Math.min(line.length-1,k+2);
            let tx=line[k2][0]-line[k1][0], ty=line[k2][1]-line[k1][1];
            const L3=Math.hypot(tx,ty)||1;
            return [tx/L3,ty/L3];
          };
          // Reihen: nur Haeuser, die DIESER Linie zugeordnet sind
          const rows=[[],[]];
          for(const h of hs){
            const inf=hInfo.get(h);
            if(!inf||inf.li!==li) continue;
            const [tx,ty]=tangAt(inf.k);
            const cr=tx*(h.cy-line[inf.k][1])-ty*(h.cx-line[inf.k][0]);
            rows[cr>=0?0:1].push({h,side:cr>=0?1:-1,q:inf.q,ax:inf.ax,f:inf.f});
          }
          for(const row of rows){
            if(row.length<2) continue;
            /* Reihenachse aus den HAUSZENTREN statt Linien-Bogenlaenge: bei weit
               entfernter/gebogener Langlinie kollabieren die Projektionen sonst
               (Nachbarn scheinbar <6 m auseinander -> Grenzen fielen aus) */
            let mx3=0,my3=0;
            for(const e of row){ mx3+=e.h.cx; my3+=e.h.cy; }
            mx3/=row.length; my3/=row.length;
            let sxx2=0,sxy2=0,syy2=0;
            for(const e of row){ const ax2=e.h.cx-mx3, ay2=e.h.cy-my3; sxx2+=ax2*ax2; sxy2+=ax2*ay2; syy2+=ay2*ay2; }
            const rang=0.5*Math.atan2(2*sxy2,sxx2-syy2);
            const rx=Math.cos(rang), ry=Math.sin(rang);
            const uOf=(x,y)=>(x-mx3)*rx+(y-my3)*ry;
            const latOf=(x,y)=>-(x-mx3)*ry+(y-my3)*rx;
            for(const e of row){
              e.u=uOf(e.h.cx,e.h.cy);
              e.lat=latOf(e.h.cx,e.h.cy);
              let lo=1e18,hi=-1e18;
              for(const q2 of e.h.p){ const t4=uOf(q2[0],q2[1]); if(t4<lo)lo=t4; if(t4>hi)hi=t4; }
              e.uLo=lo; e.uHi=hi;
            }
            row.sort((a,b)=>a.u-b.u);
            for(let i2=0;i2+1<row.length;i2++){
              const A2=row[i2], B2=row[i2+1];
              if(!A2.q&&!B2.q) continue;                     // mind. ein blaues Haus
              const pk=pairKey(A2.h,B2.h);
              if(donePairs.has(pk)) continue;
              const gap=B2.u-A2.u;
              if(gap<6||gap>60) continue;
              if(Math.abs(A2.lat-B2.lat)>18) continue;       // seitlich versetzt: keine Reihe
              if(A2.f&&B2.f&&(A2.f.fx*B2.f.fx+A2.f.fy*B2.f.fy)<0.5) continue;  // verschiedene Strassenfronten
              donePairs.add(pk);
              // Wand-zu-Wand-Mitte
              const uMid=Math.max(A2.u+2,Math.min(B2.u-2,(A2.uHi+B2.uLo)/2));
              const latM=(A2.lat+B2.lat)/2;
              // Fussweg dazwischen? -> Grenze beidseits des Wegs
              const inGapP=[];
              if(grid.pth&&!line.isPath) for(const pp of grid.pth){
                for(let s3=0;s3<pp.length-1;s3++){
                  const L3=Math.hypot(pp[s3+1][0]-pp[s3][0],pp[s3+1][1]-pp[s3][1]);
                  if(L3<0.5) continue;
                  for(let t3=0;t3<=L3;t3+=3){
                    const qx=pp[s3][0]+(pp[s3+1][0]-pp[s3][0])/L3*t3, qy=pp[s3][1]+(pp[s3+1][1]-pp[s3][1])/L3*t3;
                    const uq=uOf(qx,qy);
                    if(uq<=A2.uHi+1||uq>=B2.uLo-1) continue;
                    if(Math.abs(latOf(qx,qy)-latM)>45) continue;
                    inGapP.push(uq);
                  }
                }
              }
              const bounds=[];
              if(inGapP.length>=2){
                const uPath=inGapP.reduce((s2,o)=>s2+o,0)/inGapP.length;
                bounds.push(uPath-2.5,uPath+2.5);
              } else {
                // Kleingebaeude dazwischen? -> Grenze an dessen Kante
                let bestU=null,bestD=1e18;
                for(const sb of smalls){
                  const uq=uOf(sb.cx,sb.cy);
                  if(uq<=A2.u||uq>=B2.u) continue;
                  if(Math.abs(latOf(sb.cx,sb.cy)-latM)>45) continue;
                  let lo=1e18,hi=-1e18;
                  for(const q2 of sb.p){ const t4=uOf(q2[0],q2[1]); if(t4<lo)lo=t4; if(t4>hi)hi=t4; }
                  for(const se of [lo,hi]){
                    if(se<=A2.u+1||se>=B2.u-1) continue;
                    const dd2=Math.abs(se-uMid);
                    if(dd2<bestD){ bestD=dd2; bestU=se; }
                  }
                }
                bounds.push(bestU!=null?bestU:uMid);
              }
              // Grenzrichtung: gemittelte Seitenwand-Richtung beider Haeuser
              const ref=A2.q?A2:B2;
              let bx2=0,by2=0;
              for(const E2 of [A2,B2]){
                let a3=E2.ax;
                if(!a3){
                  const cand2=axesOf(E2.h);
                  a3=Math.abs(cand2[0][0]*ref.ax[0]+cand2[0][1]*ref.ax[1])>=Math.abs(cand2[1][0]*ref.ax[0]+cand2[1][1]*ref.ax[1])?cand2[0]:cand2[1];
                }
                if(a3[0]*ref.ax[0]+a3[1]*ref.ax[1]<0) a3=[-a3[0],-a3[1]];
                bx2+=a3[0]; by2+=a3[1];
              }
              const bl2=Math.hypot(bx2,by2)||1;
              let dirx=bx2/bl2, diry=by2/bl2;       // zeigt zur Strasse (Front)
              // Plausibilitaet: Grenze muss grob zur Strasse zeigen (Front-Strahl des
              // blauen Referenzhauses). Weicht die Wand-Erkennung >~35 Grad ab
              // (L-Grundrisse, schiefe laengste Kante), gilt die Front-Richtung
              if(ref.f){
                if(dirx*ref.f.fx+diry*ref.f.fy<0.82){ dirx=ref.f.fx; diry=ref.f.fy; }
              }
              for(const ub of bounds){
                const Mx=mx3+rx*ub-ry*latM, My=my3+ry*ub+rx*latM;
                const g=++gid;                     // eine Quergrenze = eine Grenz-ID
                // beidseitig: zur Strasse (bis isBound) und zur Langlinie (bis Linie erreicht)
                for(const sgn of [1,-1]){
                  let cur=null, started=false;
                  for(let t5=0;t5<=250;t5+=cell){
                    const x=Mx+dirx*t5*sgn, y=My+diry*t5*sgn;
                    const gx=(x/cell)|0, gy=(y/cell)|0;
                    if(gx<0||gy<0||gx>=GW||gy>=GH) break;
                    const gi=gy*GW+gx;
                    if(isBound(gi)) break;
                    const f2=flags[gi];
                    if(f2&32){ if(started) break; }  // Fussweg/Parkplatz stoppt die Grenze
                    else started=true;
                    if(blk[gi]!==id&&!(f2&1)) break;
                    const okc=!(f2&1)&&!(f2&32)&&!inH(x,y);
                    if(okc){ if(!cur) cur=[]; cur.push([x,y]); }
                    else { if(cur&&cur.length>2) boundaryRuns.push({g,pts:cur}); cur=null; }
                    if(sgn===-1&&near(x,y).d<2.5) break;   // Langlinie erreicht
                  }
                  if(cur&&cur.length>2) boundaryRuns.push({g,pts:cur});
                }
                if(A2.q) blueHouses.add(A2.h);
                if(B2.q) blueHouses.add(B2.h);
                window.crossLines.push({blk:id,u:ub});
              }
            }
          }
        }
      }
    }
    /* ===== BEBAUUNG: 80 % der Grenzen komplett mit Zaun/Hecke/Mauer, Rest offen.
       Zaun = kletterbar+durchsichtig (Bit 2), Hecke/Mauer = zusaetzlich sichtblockierend
       (Bit 2|4). Wege/Wasser/Gebaeude-Zellen werden nie ueberschrieben. ===== */
    {
      const byG=new Map();
      for(const r of boundaryRuns){
        let a=byG.get(r.g); if(!a){a=[];byG.set(r.g,a);}
        a.push(r.pts);
      }
      const dP={z:"",h:"",m:""};
      const cellRect=(i,grow)=>{
        const x=(i%GW)*cell-grow, y=((i/GW)|0)*cell-grow, s=cell+2*grow;
        return "M"+x.toFixed(1)+" "+y.toFixed(1)+"h"+s.toFixed(1)+"v"+s.toFixed(1)+"h-"+s.toFixed(1)+"z";
      };
      const stamped=new Set();
      for(const runs of byG.values()){
        // 100 % bebauen - die nicht erkannten Grenzen sind Luecken genug (Userentscheid)
        const r2=Math.random();
        const typ=r2<0.5?"z":(r2<0.9?"h":"m");
        for(const pts of runs){
          for(let k=0;k+1<pts.length;k++){
            const L2=Math.hypot(pts[k+1][0]-pts[k][0],pts[k+1][1]-pts[k][1]);
            const st=Math.max(1,Math.ceil(L2/cell));
            for(let s3=0;s3<=st;s3++){
              const x=pts[k][0]+(pts[k+1][0]-pts[k][0])*s3/st, y=pts[k][1]+(pts[k+1][1]-pts[k][1])*s3/st;
              const gx=(x/cell)|0, gy=(y/cell)|0;
              if(gx<0||gy<0||gx>=GW||gy>=GH) continue;
              const i=gy*GW+gx;
              if(stamped.has(i)) continue;
              if(flags[i]&(1|8|32)) continue;
              stamped.add(i);
              flags[i]|=2;
              if(typ!=="z") flags[i]|=4;
              grid.btype[i]=typ==="z"?1:(typ==="h"?2:3);
              dP[typ]+=cellRect(i,typ==="h"?cell*0.5:0);
            }
          }
        }
      }
      const styles={z:["#8f8f88",.9],h:["#79a163",.85],m:["#5d5d57",.95]};
      for(const t of ["h","z","m"]){
        if(!dP[t]) continue;
        const el=document.createElementNS(NS,"path");
        el.setAttribute("d",dP[t]);
        el.setAttribute("fill",styles[t][0]);
        el.setAttribute("opacity",String(styles[t][1]));
        L.fence.appendChild(el);
      }
    }
    // Fusswege durch Wohnbloecke: sichtbarer normaler Weg (kein Hindernis)
    if(dPath){
      const el=document.createElementNS(NS,"path");
      el.setAttribute("d",dPath); el.setAttribute("fill","none");
      el.setAttribute("stroke","#9a8265"); el.setAttribute("stroke-width","1.2");
      el.setAttribute("stroke-dasharray","2.6 2.2"); el.setAttribute("opacity",".85");
      L.fence.appendChild(el);
    }
    window.blockHints=[];
    return;
  }
  /* Schritt 4 (lila Hinweise): Seitenwaende kleiner Nebengebaeude (Garagen/Schuppen
     stehen meist AUF der Grundstuecksgrenze). Je Kleingebaeude die beiden Kanten,
     die in Grenzrichtung (zur gruenen Linie hin) verlaufen, leicht verlaengert.
     Fusswege sind bereits harte Blockgrenzen und brauchen keine Extra-Hinweise. */
  const lineByBlk=new Map(window.blockLines.map(o=>[o.blk,o]));
  window.blockHints=[];
  for(const p of blds){
    if(!p||p.length<3) continue;
    let a2=0,cx=0,cy=0;
    for(let i=0,j=p.length-1;i<p.length;j=i++){
      const cr=p[j][0]*p[i][1]-p[i][0]*p[j][1];
      a2+=cr; cx+=(p[j][0]+p[i][0])*cr; cy+=(p[j][1]+p[i][1])*cr;
    }
    if(a2===0) continue;
    const A=Math.abs(a2/2);
    if(A<6||A>=55) continue;                    // nur Nebengebaeude
    cx/=3*a2; cy/=3*a2;
    const ci=Math.min(GH-1,Math.max(0,(cy/cell)|0))*GW+Math.min(GW-1,Math.max(0,(cx/cell)|0));
    const bl=lineByBlk.get(blk[ci]);
    if(!bl) continue;
    // Grenzrichtung: vom Gebaeude zur naechsten Stelle der gruenen Linie
    let bx=0,by=0,bd2=1e18;
    for(let k=0;k<bl.pts.length;k+=4){
      const dx=bl.pts[k][0]-cx, dy=bl.pts[k][1]-cy, d2=dx*dx+dy*dy;
      if(d2<bd2){ bd2=d2; bx=bl.pts[k][0]; by=bl.pts[k][1]; }
    }
    const dl=Math.hypot(bx-cx,by-cy);
    if(dl<1) continue;
    const dirx=(bx-cx)/dl, diry=(by-cy)/dl;
    // OBB des Kleingebaeudes
    let best=0, th=0;
    for(let i=0;i<p.length-1;i++){
      const dx=p[i+1][0]-p[i][0], dy=p[i+1][1]-p[i][1], L2=dx*dx+dy*dy;
      if(L2>best){ best=L2; th=Math.atan2(dy,dx); }
    }
    const c=Math.cos(th), s=Math.sin(th);
    let u0=1e9,u1=-1e9,v0=1e9,v1=-1e9;
    for(const q2 of p){
      const u=q2[0]*c+q2[1]*s, v=-q2[0]*s+q2[1]*c;
      if(u<u0)u0=u; if(u>u1)u1=u; if(v<v0)v0=v; if(v>v1)v1=v;
    }
    const uc=(u0+u1)/2, vc=(v0+v1)/2, ha=(u1-u0)/2, hb=(v1-v0)/2;
    const wx=uc*c-vc*s, wy=uc*s+vc*c;
    const du=[c,s], dv=[-s,c];
    const alignU=Math.abs(du[0]*dirx+du[1]*diry), alignV=Math.abs(dv[0]*dirx+dv[1]*diry);
    if(Math.max(alignU,alignV)<0.7) continue;   // steht schief zur Grenzrichtung
    const e=alignU>=alignV?du:dv;               // Kantenrichtung laengs der Grenze
    const perp=alignU>=alignV?dv:du;
    const half=(alignU>=alignV?ha:hb)+3;        // 3 m verlaengert
    const off=alignU>=alignV?hb:ha;
    for(const sgn of [1,-1]){
      const mx=wx+perp[0]*off*sgn, my=wy+perp[1]*off*sgn;
      const h={x1:mx-e[0]*half, y1:my-e[1]*half, x2:mx+e[0]*half, y2:my+e[1]*half, blk:blk[ci]};
      window.blockHints.push(h);
      const l=document.createElementNS(NS,"line");
      l.setAttribute("x1",h.x1.toFixed(1)); l.setAttribute("y1",h.y1.toFixed(1));
      l.setAttribute("x2",h.x2.toFixed(1)); l.setAttribute("y2",h.y2.toFixed(1));
      l.setAttribute("stroke","#5b2d9e"); l.setAttribute("stroke-width","1.2");
      l.setAttribute("opacity",".9");
      L.fence.appendChild(l);
    }
  }
}
/* ===== Parzellen-Generator: Zaeune/Hecken/Mauern zwischen Einzelhaeusern =====
   Wohngebiets-Heuristik: freistehende Haeuser (35-400 m², Nachbarhaus < 60 m) werden
   Saatpunkte einer Voronoi-Flutung auf dem Raster (Strassen/Wasser begrenzen, Garagen &
   Schuppen sind Hindernisse -> Grenzen folgen deren Waenden). Grenzzellen werden zu
   ~80 % bebaut: Zaun (kletterbar, durchsichtig), Hecke/Mauer (kletterbar, sichtblockierend).
   Jede Strassenfront bekommt ein Gartentor; ~40 % der Vorgaerten bleiben offen. */
function generateParcels(blds){
  const PARCELS=false;   // Parzellen-Grenzen komplett deaktiviert (User skizziert Neugestaltung)
  if(!PARCELS||!grid) return;
  const {flags,GW,GH,cell}=grid;
  const N=GW*GH;
  L.fence.innerHTML="";
  const houses=[];
  for(const p of blds){
    if(!p||p.length<3) continue;
    let a2=0,cx=0,cy=0;
    for(let i=0,j=p.length-1;i<p.length;j=i++){
      const cr=p[j][0]*p[i][1]-p[i][0]*p[j][1];
      a2+=cr; cx+=(p[j][0]+p[i][0])*cr; cy+=(p[j][1]+p[i][1])*cr;
    }
    if(a2===0) continue;
    const A=Math.abs(a2/2);
    if(A<35||A>400) continue;
    houses.push({p,cx:cx/(3*a2),cy:cy/(3*a2)});
  }
  const use=houses.filter(h=>houses.some(o=>o!==h&&Math.hypot(o.cx-h.cx,o.cy-h.cy)<60));
  if(use.length<3) return;
  // Orientierte Bounding-Box je Haus (Ausrichtung = laengste Kante, mod 90°);
  // Zuteilung per Rechteck-Abstand IM HAUS-KOORDINATENSYSTEM: die Iso-Linien sind
  // Rechtecke parallel zu den Hauswaenden -> gerade, kantenparallele Grenzen
  const items=use.map(h=>{
    const p=h.p;
    let bl=0, th=0;
    for(let i=0;i<p.length-1;i++){
      const dx=p[i+1][0]-p[i][0], dy=p[i+1][1]-p[i][1];
      const L2=dx*dx+dy*dy;
      if(L2>bl){ bl=L2; th=Math.atan2(dy,dx); }
    }
    th=((th%(Math.PI/2))+Math.PI/2)%(Math.PI/2);
    const c=Math.cos(th), s=Math.sin(th);
    let u0=1e9,u1=-1e9,v0=1e9,v1=-1e9;
    for(const q2 of p){
      const u=q2[0]*c+q2[1]*s, v=-q2[0]*s+q2[1]*c;
      if(u<u0)u0=u; if(u>u1)u1=u; if(v<v0)v0=v; if(v>v1)v1=v;
    }
    const uc=(u0+u1)/2, vc=(v0+v1)/2;
    return {c,s,uc,vc,a:(u1-u0)/2,b:(v1-v0)/2,wx:uc*c-vc*s,wy:uc*s+vc*c};
  });
  const label=new Int32Array(N).fill(-1);
  const distV=new Float32Array(N).fill(1e9);
  const ok=i=>!(flags[i]&(1|8|32));
  const DMAX=24;   // maximale Gartentiefe (senkrecht zur Hausfront) in Metern
  const LMAX=12;   // maximale seitliche Ausdehnung neben dem Haus in Metern
  // Zuteilung LEXIKOGRAFISCH: erst seitlicher Abstand (laengs der Haeuserzeile),
  // bei Gleichstand die Tiefe. Parzellen werden dadurch Streifen senkrecht zur
  // Strasse - keine 45-Grad-Naehte ab den Hausecken mehr (Chebyshev-Artefakt).
  items.forEach((it,id)=>{
    const R=Math.max(it.a+LMAX,it.b+DMAX);
    const x0=Math.max(0,((it.wx-R)/cell)|0), x1=Math.min(GW-1,((it.wx+R)/cell)|0);
    const y0=Math.max(0,((it.wy-R)/cell)|0), y1=Math.min(GH-1,((it.wy+R)/cell)|0);
    for(let y=y0;y<=y1;y++){
      const wy=(y+0.5)*cell, row=y*GW;
      for(let x=x0;x<=x1;x++){
        const i=row+x;
        if(!ok(i)) continue;
        const wx=(x+0.5)*cell;
        const u=wx*it.c+wy*it.s, v=-wx*it.s+wy*it.c;
        const dl=Math.max(Math.abs(u-it.uc)-it.a, 0);
        const dd=Math.max(Math.abs(v-it.vc)-it.b, 0);
        if(dl>LMAX||dd>DMAX) continue;
        const key=dl*100+dd;
        if(key>=distV[i]) continue;
        distV[i]=key; label[i]=id;
      }
    }
  });
  // Zusammenhangs-Prune: jede Parzellenzelle muss vom eigenen Haus aus erreichbar sein
  // (entfernt Zuteilungen, die "ueber die Strasse" oder hinter fremde Gebaeude gerutscht sind)
  const reach=new Uint8Array(N);
  const q=new Int32Array(N);
  let qt=0;
  for(let i=0;i<N;i++) if(label[i]>=0&&distV[i]<3){ reach[i]=1; q[qt++]=i; }
  let qh=0;
  while(qh<qt){
    const i=q[qh++], id=label[i], cx=i%GW, cy=(i/GW)|0;
    if(cx>0){const nn=i-1; if(!reach[nn]&&label[nn]===id){reach[nn]=1;q[qt++]=nn;}}
    if(cx<GW-1){const nn=i+1; if(!reach[nn]&&label[nn]===id){reach[nn]=1;q[qt++]=nn;}}
    if(cy>0){const nn=i-GW; if(!reach[nn]&&label[nn]===id){reach[nn]=1;q[qt++]=nn;}}
    if(cy<GH-1){const nn=i+GW; if(!reach[nn]&&label[nn]===id){reach[nn]=1;q[qt++]=nn;}}
  }
  for(let i=0;i<N;i++) if(label[i]>=0&&!reach[i]) label[i]=-1;
  // Grenzzellen: zwischen zwei Parzellen, zur Strassenfront, am Flutungsrand (Rueckgrenze)
  const segs=new Map();
  const add=(key,i)=>{ let a=segs.get(key); if(!a){a=[];segs.set(key,a);} a.push(i); };
  const backMin=5;   // Meter: erst ab dieser Gartentiefe eine Rueckgrenze setzen
  for(let y=0;y<GH;y++){
    const row=y*GW;
    for(let x=0;x<GW;x++){
      const i=row+x, id=label[i];
      if(id<0) continue;
      let front=false, back=false;
      const nb=[x>0?i-1:-1,x<GW-1?i+1:-1,y>0?i-GW:-1,y<GH-1?i+GW:-1];
      for(const nn of nb){
        if(nn<0) continue;
        const l2=label[nn];
        if(l2>=0){ if(l2!==id&&id<l2) add(id+"|"+l2,i); }
        else if(flags[nn]&32) front=true;
        else if(ok(nn)) back=true;
      }
      if(front) add("f"+id,i);
      else if(back&&distV[i]>backMin) add("b"+id,i);
    }
  }
  const dPaths={z:"",h:"",m:""};
  const cellRect=(i,grow)=>{
    const x=(i%GW)*cell-grow, y=((i/GW)|0)*cell-grow, s=cell+2*grow;
    return "M"+x.toFixed(1)+" "+y.toFixed(1)+"h"+s.toFixed(1)+"v"+s.toFixed(1)+"h-"+s.toFixed(1)+"z";
  };
  for(const cells of segs.values()){
    if(Math.random()>0.8) continue;                 // 20 % aller Grenzen bleiben komplett offen
    const r=Math.random();
    const HEDGES=false;   // Hecken vorerst deaktiviert (User skizziert Neugestaltung)
    const typ=r<0.5?"z":(r<0.9?(HEDGES?"h":"z"):"m");
    for(const i of cells){                          // bebaute Grenzen durchgehend (nur Fusswege bleiben frei)
      if(flags[i]&(1|8|32)) continue;
      flags[i]|=2;
      if(typ!=="z") flags[i]|=4;                    // Hecke/Mauer blockieren Sicht
      dPaths[typ]+=cellRect(i,typ==="h"?cell*0.5:0);
    }
  }
  const styles={z:["#8f8f88",.9],h:["#79a163",.85],m:["#5d5d57",.95]};
  for(const t of ["h","z","m"]){
    if(!dPaths[t]) continue;
    const el=document.createElementNS(NS,"path");
    el.setAttribute("d",dPaths[t]);
    el.setAttribute("fill",styles[t][0]);
    el.setAttribute("opacity",String(styles[t][1]));
    L.fence.appendChild(el);
  }
}
function compAt(x,y){
  if(!grid||!grid.comp) return -1;
  const {GW,GH,cell}=grid;
  const cx=Math.min(GW-1,Math.max(0,Math.floor(x/cell))), cy=Math.min(GH-1,Math.max(0,Math.floor(y/cell)));
  return grid.comp[cy*GW+cx];
}
function drawCompOverlay(){
  const {GW,GH,cell,comp,flags,playable}=grid;
  const cv=document.createElement("canvas");
  cv.width=GW; cv.height=GH;
  const ctx=cv.getContext("2d");
  const img=ctx.createImageData(GW,GH);
  const TINTS=[[60,120,200],[60,160,80],[210,150,50],[150,80,190],[0,150,160],[200,80,140]];
  const pIdx=new Map(playable.map((id,i)=>[id,i]));
  for(let i=0;i<GW*GH;i++){
    if(flags[i]&1) continue;
    const o=i*4;
    const pi=pIdx.get(comp[i]);
    if(pi!==undefined){
      const t=TINTS[pi%TINTS.length];
      img.data[o]=t[0]; img.data[o+1]=t[1]; img.data[o+2]=t[2]; img.data[o+3]=42;
    } else {
      img.data[o]=175; img.data[o+1]=55; img.data[o+2]=45; img.data[o+3]=80;
    }
  }
  ctx.putImageData(img,0,0);
  L.comp.innerHTML="";
  const im=document.createElementNS(NS,"image");
  im.setAttribute("href",cv.toDataURL());
  im.setAttribute("x",0); im.setAttribute("y",0);
  im.setAttribute("width",GW*cell); im.setAttribute("height",GH*cell);
  im.setAttribute("preserveAspectRatio","none");
  im.setAttribute("pointer-events","none");
  L.comp.appendChild(im);
}
/* ===== Wissens-Ebenen: unerkundet (dunkel) / erkundet / beobachtet & gesichert (Spielerfarbe) ===== */
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
let lastKnow=0, lastKsig="", visScratch=null, contScratch=null, knowStack=null, knowImg=null, knowCv=null, visHScratch=null, visBScratch=null;
let fpG=null, fpCame=null, fpVer=null, fpClosedV=null, fpVerN=0;
/* Wissens-System rechnet auf einem Halb-Raster (1/4 der Zellen) – bei 2000er-Grids
   sonst zu teuer fuer fluessiges Spiel mit vielen Einheiten */
function ensureHalfGrid(){
  if(grid.KW) return;
  const {flags,GW,GH,comp}=grid;
  const KW=Math.ceil(GW/2), KH=Math.ceil(GH/2);
  const hFlags=new Uint8Array(KW*KH);
  const hComp=new Int32Array(KW*KH).fill(-1);
  for(let y=0;y<KH;y++){
    for(let x=0;x<KW;x++){
      let f=0, c=-1;
      for(let dy=0;dy<2;dy++){
        const yy=y*2+dy; if(yy>=GH) continue;
        const row=yy*GW;

function updateKnowledge(force){

    +(m.focus?(m.focus.type+((((m.focus.ang||0))*32)|0)+","+((m.focus.x||0)|0)+"_"+((m.focus.y||0)|0)):"")
    +(m.walk&&m.walkDir!=null?"w"+((m.walkDir*32)|0):"")+(m.carry||"")).join(";")
    +"#"+markers.filter(m=>m.dummy&&!m.dead).length;

  kimg.style.display="";
  const K=knowledgeFor(placeColor);
  const {KW,KH,hFlags,hComp,cell}=grid;
  const cell2=cell*2, N2=KW*KH;
  if(!visScratch||visScratch.length!==N2){ visScratch=new Uint8Array(N2); contScratch=new Uint8Array(N2); knowStack=new Int32Array(N2); visHScratch=new Uint8Array(N2); visBScratch=new Uint8Array(N2); }

  for(const m of active){
    const h=headingOf(m);
    const inF=flagsAt(m.x,m.y)&16;
    const NR=Math.min(Math.max(128,Math.ceil(2*Math.PI*140/cell2)),Math.max(160,Math.floor(2400/active.length)));
    for(let r=0;r<NR;r++){
      const a=r/NR*2*Math.PI;
      const R=h===null?radiusFor(m,0):radiusFor(m,angDiff(a,h));
      const dx=Math.cos(a), dy=Math.sin(a);
      let used=0, t=0;
      for(;;){
        t+=cell2;
        if(t>=R) break;
        const cx=Math.floor((m.x+dx*t)/cell2), cy=Math.floor((m.y+dy*t)/cell2);
        if(cx<0||cy<0||cx>=KW||cy>=KH) break;

    const cx=(m.x/cell2)|0, cy=(m.y/cell2)|0;

    by0=Math.min(by0,cy-BR); by1=Math.max(by1,cy+BR);
  }
  bx0=Math.max(0,bx0); by0=Math.max(0,by0); bx1=Math.min(KW-1,bx1); by1=Math.min(KH-1,by1);

  for(let x=bx0;x<=bx1;x++){
    for(let y=by0;y<=by1;y++){
      const a=Math.max(by0,y-2), b=Math.min(by1,y+2);
      let v=0;
      for(let y2=a;y2<=b;y2++) if(visH[y2*KW+x]){ v=1; break; }

    }
  }
  // Kontamination: Unsicherheit flutet durch unbeobachtete begehbare Zellen dieser Komponenten
  const cont=contScratch; cont.fill(0);
  let sp=0;
  for(let i=0;i<N2;i++){
    if(hFlags[i]&1) continue;
    const cc=hComp[i];
    if(cc<0||!eMask[cc]) continue;
    if(!K.safe[i]&&!visB[i]){ cont[i]=1; knowStack[sp++]=i; }
  }

    const c=knowStack[--sp];
    const cx=c%KW, cy=(c/KW)|0;
    if(cx>0){ const nn=c-1; if(!(hFlags[nn]&1)&&!visB[nn]&&!cont[nn]){ cont[nn]=1; knowStack[sp++]=nn; } }
    if(cx<KW-1){ const nn=c+1; if(!(hFlags[nn]&1)&&!visB[nn]&&!cont[nn]){ cont[nn]=1; knowStack[sp++]=nn; } }
    if(cy>0){ const nn=c-KW; if(!(hFlags[nn]&1)&&!visB[nn]&&!cont[nn]){ cont[nn]=1; knowStack[sp++]=nn; } }
    if(cy<KH-1){ const nn=c+KW; if(!(hFlags[nn]&1)&&!visB[nn]&&!cont[nn]){ cont[nn]=1; knowStack[sp++]=nn; } }
  }

    if(hFlags[i]&1){ K.safe[i]=0; continue; }

        if(cx>0){ const nn=c-1; if(!(hFlags[nn]&1)&&!K.safe[nn]&&!seen[nn]){ seen[nn]=1; knowStack[sp2++]=nn; } }
        if(cx<KW-1){ const nn=c+1; if(!(hFlags[nn]&1)&&!K.safe[nn]&&!seen[nn]){ seen[nn]=1; knowStack[sp2++]=nn; } }
        if(cy>0){ const nn=c-KW; if(!(hFlags[nn]&1)&&!K.safe[nn]&&!seen[nn]){ seen[nn]=1; knowStack[sp2++]=nn; } }
        if(cy<KH-1){ const nn=c+KW; if(!(hFlags[nn]&1)&&!K.safe[nn]&&!seen[nn]){ seen[nn]=1; knowStack[sp2++]=nn; } }

  ctx.putImageData(img,0,0);

}
function flagsAt(x,y){
  if(!grid) return 0;
  const {flags,GW,GH,cell}=grid;
  const cx=Math.min(GW-1,Math.max(0,Math.floor(x/cell))), cy=Math.min(GH-1,Math.max(0,Math.floor(y/cell)));
  return flags[cy*GW+cx];

function speedFactor(f){
  if(f&32) return 1.4;     // Strasse/Weg zuerst: Bruecken & Uferwege ueber/nahe Wasser bleiben begehbar
  if(f&8) return 0.2;      // Wasser: extrem eingeschraenkt
  if(f&16) return 0.75;    // Wald: langsamer
  if(f&128) return 0.85;   // Wiese/Gruenflaeche: langsamer als befestigter Boden
  return 1;

function findPath(x0m,y0m,x1m,y1m){
  const {flags,GW,GH,cell}=grid;
  const cellOf=(x,y)=>[Math.min(GW-1,Math.max(0,Math.floor(x/cell))),Math.min(GH-1,Math.max(0,Math.floor(y/cell)))];
  const freeNear=(cx,cy)=>{
    if(!(flags[cy*GW+cx]&1)) return [cx,cy];
    for(let r=1;r<80;r++) for(let dy=-r;dy<=r;dy++) for(let dx=-r;dx<=r;dx++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=GW||ny>=GH) continue;
      if(!(flags[ny*GW+nx]&1)) return [nx,ny];
    }
    return null;
  };
  const sC=freeNear(...cellOf(x0m,y0m)), eC=freeNear(...cellOf(x1m,y1m));
  if(!sC||!eC) return null;
  // Scratch-Arrays wiederverwenden (30+ MB Allokation pro Wegsuche = GC-Ruckler bei vielen Einheiten);
  // Gueltigkeit per Versionsstempel statt teurem fill()
  if(!fpG||fpG.length!==GW*GH){ fpG=new Float64Array(GW*GH); fpCame=new Int32Array(GW*GH); fpVer=new Int32Array(GW*GH); fpClosedV=new Int32Array(GW*GH); fpVerN=0; }
  const ver=++fpVerN;
  const g={ get(i){ return fpVer[i]===ver?fpG[i]:Infinity; }, set(i,v){ fpVer[i]=ver; fpG[i]=v; } };
  const came=fpCame, closed=fpClosedV;
  const heap=[];
  const push=(f,i)=>{ heap.push([f,i]); let c=heap.length-1; while(c>0){const p=(c-1)>>1; if(heap[p][0]<=heap[c][0])break; const t=heap[p];heap[p]=heap[c];heap[c]=t; c=p;} };
  const pop=()=>{ const top=heap[0], last=heap.pop(); if(heap.length){ heap[0]=last; let c=0; for(;;){ let l=2*c+1,r2=l+1,m=c; if(l<heap.length&&heap[l][0]<heap[m][0])m=l; if(r2<heap.length&&heap[r2][0]<heap[m][0])m=r2; if(m===c)break; const t=heap[m];heap[m]=heap[c];heap[c]=t; c=m; } } return top; };
  const sI=sC[1]*GW+sC[0], eI=eC[1]*GW+eC[0], ex=eC[0], ey=eC[1];

    const [,i]=pop();
    if(closed[i]===ver) continue;

    if(++pops>2500000) break;

      const nx=cx+dx, ny=cy+dy;
      if(nx<0||ny<0||nx>=GW||ny>=GH) continue;
      const ni=ny*GW+nx;
      if(flags[ni]&1) continue;
      if(dx&&dy&&((flags[cy*GW+nx]&1)||(flags[ny*GW+cx]&1))) continue;
      // diagonale Zaun-/Heckenlinien (1 Zelle duenn, nur eckverbunden) nicht
      // durchschluepfen: quer dazu muss eine Barrierezelle betreten werden
      if(dx&&dy&&(flags[cy*GW+nx]&2)&&(flags[ny*GW+cx]&2)&&!(flags[ni]&2)&&!(flags[i]&2)) continue;
      let c2=((dx&&dy)?DIAG:cell)/speedFactor(flags[ni]);   // Zeit-Kosten: Strassen bevorzugt, Wasser meiden
      // Klettern kostet echte Zeit: Dauer je Typ in Meter-Aequivalent (dur*WSPEED)
      if((flags[ni]&2)&&!(flags[i]&2)) c2+=BARRTYP[grid.btype?grid.btype[ni]:0][0]*WSPEED;
      const ng=gi+c2;

        push(ng+Math.hypot(nx-ex,ny-ey)*cell*0.7, ni);      // 0.7 ≈ 1/max-Speed (zulaessige Heuristik)

  const evFrac=[]; let cum=0;

  for(let i2=0;i2<evFrac.length;i2++) evFrac[i2].f/=Math.max(1e-9,cum);

    // Glaettung darf weder Gebaeude (1) noch Barrieren (2) schneiden – sonst
    // kuerzt der geglaettete Weg ueber Zaunecken ab und das Kletter-Event fehlt
    const ax=(a%GW)+0.5, ay=((a/GW)|0)+0.5, bx=(b%GW)+0.5, by=((b/GW)|0)+0.5;
    const steps=Math.ceil(Math.hypot(bx-ax,by-ay)*2);
    for(let s2=1;s2<steps;s2++){
      const t=s2/steps;
      if(flags[Math.floor(ay+(by-ay)*t)*GW+Math.floor(ax+(bx-ax)*t)]&3) return false;
    }
    return true;
  };
  const simp=[cells[0]];
  let i0=0;
  while(i0<cells.length-1){
    let j=cells.length-1;
    while(j>i0+1&&!los(cells[i0],cells[j])) j--;
    simp.push(cells[j]); i0=j;
  }
  const pts=simp.map(i2=>[((i2%GW)+0.5)*cell, (((i2/GW)|0)+0.5)*cell]);
  pts[0]=[x0m,y0m];
  return {pts, evFrac};
}

/* Fog of War: Nebel ueberall ausser in den Sichtfeldern der aktiven Farbe.
   Fokus: Punkt (Rechtsklick) oder Richtung (Doppel-Rechtsklick) formt das Sichtfeld. */
const VIS=80, RAYS=96;
let fogRect=null;
const angDiff=(a,b)=>{ let d=a-b; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI; return d; };

    if(m.walk&&m.walkDir!=null) return m.walkDir;    // ohne Fokus: Blick in Laufrichtung
    return null;
  }
  const t=m.focus.type;
  if(t==="dir"||t==="facedir") return m.focus.ang;

function radiusFor(m,rel){

  } else if(t||(m.walk&&m.walkDir!=null)){       // Blickrichtung (auch beim Laufen ohne Fokus)
    const c=Math.max(0,Math.min(1,(Math.cos(rel)+0.15)/0.3));

  } else R=VIS;                                  // stehend ohne alles: rundum 80 m
